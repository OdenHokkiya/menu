<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>北寄や 2階オーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Baloo+2:wght@400;600;700&family=Gaegu:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF1DC;
    --cream-deep:#F0E2C0;
    --wine:#8B1A1A;
    --wine-deep:#6e1414;
    --ember:#8B1A1A;
    --ink:#3E2A1C;
    --ink-soft:#9b7a5e;
    --line:#E3CFa0;
    --gold:#F0B429;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body.lang-ja{font-family:'Zen Maru Gothic',sans-serif;}
  body.lang-vi,body.lang-en{font-family:'Baloo 2',sans-serif;}
  body.lang-ko{font-family:'Gaegu',sans-serif;}
  body.lang-zh{font-family:'ZCOOL KuaiLe',sans-serif;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Zen Maru Gothic',"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    padding-bottom:96px;
    min-height:100vh;
  }
  .lang-bar{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:10px 12px;
    background:var(--cream-deep);
    scrollbar-width:none;
  }
  .lang-bar::-webkit-scrollbar{display:none;}
  .lang-pill{
    flex:none;
    padding:6px 14px;
    border-radius:999px;
    border:1.5px solid var(--wine);
    background:#fff;
    color:var(--wine);
    font-size:12.5px;
    font-weight:700;
  }
  .lang-pill.active{background:var(--wine);color:#fff;}

  header{
    background:var(--wine);
    color:#fff;
    padding:18px 16px 10px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    text-align:center;
  }
  header .brand{display:flex;flex-direction:column;align-items:center;}
  header h1{
    font-family:'Yusei Magic',cursive;
    font-weight:400;
    font-size:24px;
    margin:2px 0 2px;
    letter-spacing:.06em;
  }
  header h1 .lantern{font-size:16px;vertical-align:0;margin:0 4px;}
  header .brand-en{
    font-size:10px;
    letter-spacing:.3em;
    color:var(--gold);
    margin:0 0 4px;
  }
  header .sub{margin:0;font-size:12px;color:#E8C9A0;letter-spacing:.06em;}
  header .seat-badge{
    position:absolute;top:16px;right:16px;
    background:var(--gold);color:var(--wine-deep);
    font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;
  }
  .header-edge{
    height:10px;
    background:
      linear-gradient(135deg, var(--wine) 25%, transparent 25.5%),
      linear-gradient(225deg, var(--wine) 25%, transparent 25.5%);
    background-size:12px 12px;
    background-position:0 0, 6px 0;
    background-color:var(--cream);
  }

  .tabs{
    position:sticky;top:106px;z-index:19;
    display:flex;gap:8px;overflow-x:auto;
    padding:12px 14px;background:var(--cream);
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;padding:9px 16px;border-radius:999px;
    border:1.5px solid var(--wine);color:var(--wine);
    background:#fff;font-size:14px;font-weight:700;white-space:nowrap;
  }
  .tab.active{background:var(--wine);color:#fff;}
  .tab.tab-other{
    border-color:var(--gold);
    color:var(--ember);
    background:#FFF8EA;
  }
  .other-bottom{
    padding:8px 14px 30px;
  }
  .other-bottom button{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:1.5px dashed var(--gold);
    background:#FFF8EA;
    color:var(--ember);
    font-weight:700;
    font-size:15px;
  }

  .cat-head{display:flex;align-items:center;gap:8px;margin:22px 16px 10px;color:var(--wine);}
  .cat-head .mark{font-size:18px;}
  .cat-head h2{font-size:16px;margin:0;font-weight:700;letter-spacing:.03em;}
  .cat-head::after{content:"";flex:1;border-bottom:2px dashed var(--gold);margin-left:4px;}
  .subgroup-label{margin:14px 16px 6px;font-size:13px;font-weight:700;color:var(--ember);}

  .items{padding:0 12px;}
  .item{
    display:flex;align-items:center;gap:12px;background:#fff;
    border-radius:16px;padding:12px;margin-bottom:10px;border:1px solid var(--line);
  }
  .item .icon{
    width:52px;height:52px;border-radius:12px;background:var(--cream-deep);
    display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;
    overflow:hidden;
  }
  .item .icon img{
    width:100%;height:100%;object-fit:cover;
    display:block;
  }
  .item .info{flex:1;min-width:0;}
  .item .name{font-size:15px;font-weight:700;line-height:1.3;}
  .item .price{font-size:13px;color:var(--ember);font-weight:700;margin-top:2px;}
  .stepper{display:flex;align-items:center;flex:none;border:1.5px solid var(--wine);border-radius:999px;overflow:hidden;}
  .stepper button{width:32px;height:32px;border:none;background:#fff;color:var(--wine);font-size:18px;font-weight:700;line-height:1;}
  .stepper button:active{background:var(--cream-deep);}
  .stepper .qty{width:26px;text-align:center;font-weight:700;font-size:14px;}
  .item.has-qty{background:#FFF8EA;border-color:var(--gold);}

  .bottombar{
    position:fixed;bottom:0;left:0;right:0;background:var(--wine);color:#fff;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:12px;z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,.2);
  }
  .bottombar .count{font-size:13px;color:#E8C9A0;}
  .bottombar .total{font-size:17px;font-weight:700;}
  .bottombar button{
    margin-left:auto;background:var(--gold);color:var(--wine-deep);border:none;
    font-weight:700;font-size:15px;padding:12px 22px;border-radius:999px;
  }
  .bottombar button:disabled{background:#8a7860;color:#d8cdb8;}

  .seat-screen{
    position:fixed;inset:0;background:var(--wine);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;z-index:50;padding:24px;text-align:center;
  }
  .lang-bar-seat{
    position:absolute;
    top:0;left:0;right:0;
    background:transparent;
    justify-content:center;
    padding:14px 12px;
  }
  .lang-bar-seat .lang-pill{
    border-color:var(--gold);
    background:rgba(255,255,255,.08);
    color:#fff;
  }
  .lang-bar-seat .lang-pill.active{
    background:var(--gold);
    color:var(--wine-deep);
  }
  .quick-actions{
    display:flex;
    gap:8px;
    padding:10px 14px 4px;
    background:var(--cream);
  }
  .quick-actions button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:10px 6px;
    border-radius:14px;
    border:1.5px solid var(--wine);
    background:#fff;
    color:var(--wine);
    font-size:12px;
    font-weight:700;
  }
  .quick-actions button:active{background:var(--cream-deep);}
  .quick-actions button .qa-icon{font-size:19px;}
  .quick-actions button:disabled{opacity:.5;}

  .toast{
    position:fixed;
    left:50%;
    bottom:100px;
    transform:translateX(-50%) translateY(20px);
    background:var(--wine-deep);
    color:#fff;
    padding:12px 22px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    z-index:80;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .qa-modal-overlay{
    position:fixed;inset:0;
    background:rgba(58,42,30,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:65;
    padding:20px;
  }
  .qa-modal-overlay.show{display:flex;}
  .qa-modal{
    background:#fff;
    border-radius:18px;
    max-width:340px;
    width:100%;
    padding:20px;
  }
  .qa-modal h3{margin:0 0 12px;font-size:16px;color:var(--wine);}
  .qa-modal textarea{
    width:100%;
    min-height:80px;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px;
    font-size:14px;
    font-family:inherit;
    resize:vertical;
    box-sizing:border-box;
  }
  .qa-modal .qa-modal-actions{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .qa-modal .qa-modal-actions button{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:none;
    font-weight:700;
    font-size:14px;
  }
  .page-tabs{
    display:flex;
    gap:6px;
    padding:10px 14px 0;
    overflow-x:auto;
    background:var(--cream);
    scrollbar-width:none;
  }
  .page-tabs::-webkit-scrollbar{display:none;}
  .page-tab{
    flex:none;
    padding:8px 14px;
    border-radius:999px 999px 0 0;
    border:1.5px solid var(--wine);
    border-bottom:none;
    background:#fff;
    color:var(--wine);
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
  }
  .page-tab.active{
    background:var(--wine);
    color:#fff;
  }
  .info-page{
    padding:18px 16px 40px;
  }
  .info-page .lead{
    font-size:14px;
    color:var(--ink);
    line-height:1.7;
    margin-bottom:20px;
  }
  .info-page h2{
    font-size:17px;
    color:var(--wine);
    margin:26px 0 8px;
  }
  .info-page h2:first-child{margin-top:0;}
  .info-page p{
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink);
    margin:0 0 10px;
  }
  .info-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    margin-bottom:14px;
    display:flex;
    gap:12px;
  }
  .info-card .icon{
    width:56px;height:56px;border-radius:12px;background:var(--cream-deep);
    display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;overflow:hidden;
  }
  .info-card .icon img{width:100%;height:100%;object-fit:cover;}
  .info-card .body{flex:1;min-width:0;}
  .info-card .badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--ember);
    background:#FFF3DC;
    border-radius:999px;
    padding:2px 10px;
    margin-bottom:4px;
  }
  .info-card .name{font-size:15px;font-weight:700;margin-bottom:4px;}
  .info-card .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
  .info-card .price{font-size:14px;font-weight:700;color:var(--ember);margin-top:6px;}
  .info-card .note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .sake-stars{color:var(--gold);font-size:13px;letter-spacing:1px;}
  .sake-param-row{display:flex;justify-content:space-between;font-size:12.5px;margin-top:3px;}
  .about-tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px;}
  .about-tag{
    background:var(--cream-deep);
    color:var(--wine);
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
  }
  .steps-list{
    margin:8px 0 0;
    padding-left:20px;
    font-size:13px;
    color:var(--ink);
    line-height:1.8;
  }
  .seat-screen{position:fixed;}
  .seat-screen .mark{font-size:40px;}
  .seat-screen h2{margin:0;font-size:20px;letter-spacing:.04em;}
  .seat-screen p{margin:0;color:#E8C9A0;font-size:14px;}
  .seat-options{display:flex;gap:16px;}
  .seat-options button{
    width:120px;height:120px;border-radius:20px;border:2px solid var(--gold);
    background:rgba(255,255,255,.06);color:#fff;font-size:20px;font-weight:700;
  }
  .seat-options button:active{background:var(--gold);color:var(--wine-deep);}

  .overlay{
    position:fixed;inset:0;background:rgba(58,42,30,.55);
    display:none;align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:#fff;border-radius:20px;max-width:380px;width:100%;
    max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .sheet header{background:var(--wine);position:static;box-shadow:none;padding:16px;}
  .sheet header h3{margin:0;font-size:16px;}
  .sheet .list{padding:12px 16px;overflow-y:auto;flex:1;}
  .sheet .row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);}
  .sheet .row .n{font-weight:700;}
  .sheet .total-row{
    display:flex;justify-content:space-between;padding:14px 16px;
    font-weight:700;font-size:16px;color:var(--wine);border-top:2px solid var(--line);
  }
  .tax-note{
    padding:0 16px 10px;
    margin-top:-8px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
  }
  .sheet .actions{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));}
  .sheet .actions button{flex:1;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:15px;}
  .btn-cancel{background:var(--cream-deep);color:var(--ink);}
  .btn-send{background:var(--wine);color:#fff;}
  .btn-send:disabled{background:#b8a68c;}

  .success-screen{
    position:fixed;inset:0;background:var(--wine);color:#fff;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:70;padding:24px;text-align:center;
  }
  .success-screen.show{display:flex;}
  .success-screen .mark{font-size:52px;}
  .success-screen h2{margin:0;font-size:20px;}
  .success-screen p{margin:0;color:#E8C9A0;font-size:14px;}
  .success-screen button{
    margin-top:12px;background:var(--gold);color:var(--wine-deep);border:none;
    font-weight:700;padding:12px 26px;border-radius:999px;font-size:15px;
  }
  .error-msg{color:#ffd7d7;font-size:13px;margin-top:8px;}
</style>
</head>
<body class="lang-ja">

<div class="seat-screen" id="seatScreen">
  <div class="lang-bar lang-bar-seat" id="langBarSeat"></div>
  <div class="mark">🐻</div>
  <h2 id="seatTitle">2階のお席をお選びください</h2>
  <p id="seatDesc">お座りのテーブル番号を選んでください</p>
  <div class="seat-options">
    <button onclick="chooseSeat('1')">1</button>
    <button onclick="chooseSeat('2')">2</button>
  </div>
</div>

<div class="lang-bar" id="langBar"></div>

<header>
  <div class="brand">
    <div>
      <h1><span class="lantern">🏮</span>北寄や<span class="lantern">🏮</span></h1>
      <p class="brand-en">HOKKIYA</p>
      <p class="sub" id="headerSub">2階オーダー</p>
    </div>
  </div>
  <div class="seat-badge" id="seatBadge">-</div>
</header>
<div class="header-edge"></div>

<div class="quick-actions">
  <button onclick="openHistoryModal()">
    <span class="qa-icon">🧾</span>
    <span id="qaHistoryLabel">注文履歴</span>
  </button>
  <button onclick="quickAction('call')">
    <span class="qa-icon">🔔</span>
    <span id="qaCallLabel">スタッフを呼ぶ</span>
  </button>
  <button onclick="quickAction('bill')">
    <span class="qa-icon">💰</span>
    <span id="qaBillLabel">お会計</span>
  </button>
</div>

<div class="page-tabs" id="pageTabs">
  <button class="page-tab active" id="pageTabMenu" onclick="switchPage('menu')">🍽️ メニュー</button>
  <button class="page-tab" id="pageTabSake" onclick="switchPage('sake')">🍶 SAKE</button>
  <button class="page-tab" id="pageTabOsusume" onclick="switchPage('osusume')">✨ おすすめ</button>
  <button class="page-tab" id="pageTabAbout" onclick="switchPage('about')">🏮 お店紹介</button>
</div>

<div class="tabs" id="tabs"></div>
<div id="menuRoot"></div>
<div id="infoRoot" style="display:none;"></div>

<div class="bottombar">
  <div>
    <div class="count" id="countLabel">0</div>
    <div class="total" id="totalLabel">0đ</div>
  </div>
  <button id="reviewBtn" disabled onclick="openReview()"></button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <header><h3 id="reviewTitle">🐻 ご注文内容</h3></header>
    <div class="list" id="reviewList"></div>
    <div class="total-row"><span id="reviewTotalLabel">合計</span><span id="reviewTotal">0đ</span></div>
    <div class="tax-note" id="reviewTaxNote">※ 表示価格に税金は含まれていません</div>
    <div class="actions">
      <button class="btn-cancel" id="backBtn" onclick="closeReview()">戻る</button>
      <button class="btn-send" id="sendBtn" onclick="sendOrder()">この内容で注文する</button>
    </div>
    <div class="error-msg" id="errorMsg" style="display:none;padding:0 16px 12px;"></div>
  </div>
</div>

<div class="qa-modal-overlay" id="qaOtherOverlay">
  <div class="qa-modal">
    <h3 id="qaOtherTitle">その他のご要望</h3>
    <textarea id="qaOtherText" placeholder=""></textarea>
    <div class="qa-modal-actions">
      <button class="btn-cancel" id="qaOtherCancel" onclick="closeOtherModal()">戻る</button>
      <button class="btn-send" id="qaOtherSend" onclick="sendOtherRequest()">送信する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="historyOverlay">
  <div class="sheet">
    <header><h3 id="historyTitle">🧾 注文履歴</h3></header>
    <div class="list" id="historyList"></div>
    <div class="total-row"><span id="historyTotalLabel">合計</span><span id="historyTotal">0đ</span></div>
    <div class="tax-note" id="historyTaxNote">※ 表示価格に税金は含まれていません</div>
    <div class="actions">
      <button class="btn-send" id="historyCloseBtn" onclick="closeHistoryModal()" style="flex:1;">閉じる</button>
    </div>
  </div>
</div>

<div class="success-screen" id="successScreen">
  <div class="mark">✅</div>
  <h2 id="successTitle">ご注文ありがとうございます</h2>
  <p id="successDesc">スタッフがすぐに参ります。<br>少々お待ちください。</p>
  <button onclick="resetOrder()" id="continueBtn">続けて注文する</button>
</div>

async function sendTelegramText(text){
  const res = await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
    method: "POST",

}

async function translateText(text, targetCode){
  try{
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=autodetect|" + targetCode;
    const res = await fetch(url);
    const data = await res.json();
    const translated = data && data.responseData && data.responseData.translatedText;
    return translated || null;
  } catch(e){
    return null;
  }
}

async function sendOtherRequest(){
  const val = document.getElementById("qaOtherText").value.trim();
  if(!val) return;
  const btn = document.getElementById("qaOtherSend");
  btn.disabled = true;
  btn.textContent = STR.sending[LANG];

  const [jaText, viText] = await Promise.all([
    translateText(val, "ja"),
    translateText(val, "vi")
  ]);

  let body;
  if(!jaText && !viText){
    body = val + "\n(自動翻訳できませんでした / Không thể dịch tự động)";
  } else {
    body = "🇯🇵 " + (jaText || val) + "\n🇻🇳 " + (viText || val);
  }

  const text = "🔔 " + STR.qaOtherMsg.ja + " / " + STR.qaOtherMsg.vi + "\n" +
    STR.seatWord.ja + "/" + STR.seatWord.vi + ": " + seat + "番\n\n" + body;
  try{
    await sendTelegramText(text);
    closeOtherModal();
    showToast(STR.qaSentToast[LANG]);
  } catch(err){
    showToast(STR.errorMsg[LANG](err.message));
  }
  btn.disabled = false;
  btn.textContent = STR.qaSendBtn[LANG];
}

async function sendOrder(){
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  btn.textContent = STR.sending[LANG];

  let lines = [];
  let total = 0;
  const orderedItems = [];
  Object.values(cart).forEach(function(it){
    if(it.qty > 0){
      lines.push("・"+it.names.ja+" / "+it.names.vi+" ×"+it.qty);
      total += it.qty * it.price;
      orderedItems.push({ names: it.names, price: it.price, qty: it.qty });
    }
  });

  const text = "🔔 " + STR.orderNotifyTitle.ja + " / " + STR.orderNotifyTitle.vi + "\n" +
    STR.seatWord.ja + "/" + STR.seatWord.vi + ": " + seat + "番\n\n" +
    lines.join("\n") +
    "\n\n" + STR.totalWord.ja + "/" + STR.totalWord.vi + ": " + total.toLocaleString() + "đ";

  try{
    const res = await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.description || "send failed");

    addToHistory(orderedItems);
    document.getElementById("overlay").classList.remove("show");
    document.getElementById("successScreen").classList.add("show");
  } catch(err){
    document.getElementById("errorMsg").textContent = STR.errorMsg[LANG](err.message);
    document.getElementById("errorMsg").style.display = "block";
    btn.disabled = false;
    btn.textContent = STR.sendBtn[LANG];
  }
}

/* ====== 注文履歴（6時間で自動的に消える） ====== */
const HISTORY_EXPIRY_MS = 6 * 60 * 60 * 1000; // 6時間
function historyKey(){ return "hokkiya_order_history_seat" + seat; }
function loadHistory(){
  if(!seat) return [];
  try{
    const raw = localStorage.getItem(historyKey());
    if(!raw) return [];
    const list = JSON.parse(raw);
    const now = Date.now();
    const fresh = list.filter(function(it){ return (now - it.time) < HISTORY_EXPIRY_MS; });
    if(fresh.length !== list.length) saveHistoryList(fresh);
    return fresh;
  } catch(e){ return []; }
}
function saveHistoryList(list){
  if(!seat) return;
  try{ localStorage.setItem(historyKey(), JSON.stringify(list)); } catch(e){}
}
function addToHistory(items){
  if(!items.length) return;
  const list = loadHistory();
  items.forEach(function(it){
    list.push({ ja: it.names.ja, vi: it.names.vi, price: it.price, qty: it.qty, time: Date.now() });
  });
  saveHistoryList(list);
  renderHistory();
}
function clearHistory(){
  if(!seat) return;
  localStorage.removeItem(historyKey());
  renderHistory();
}
function renderHistory(){
  const listEl = document.getElementById("historyList");
  const totalEl = document.getElementById("historyTotal");
  if(!listEl || !totalEl) return;
  const list = loadHistory();
  listEl.innerHTML = "";
  if(list.length === 0){
    const p = document.createElement("div");
    p.style.padding = "20px 0";
    p.style.textAlign = "center";
    p.style.color = "var(--ink-soft)";
    p.textContent = STR.historyEmpty[LANG];
    listEl.appendChild(p);
    totalEl.textContent = "0đ";
    return;
  }
  let total = 0;
  list.forEach(function(it){
    total += it.price * it.qty;
    const row = document.createElement("div");
    row.className = "row";
    const name = LANG === "vi" ? it.vi : it.ja;
    row.innerHTML = "<span>" + name + " × " + it.qty + "</span><span class=\"n\">" + (it.price*it.qty).toLocaleString() + "đ</span>";
    listEl.appendChild(row);
  });
  totalEl.textContent = total.toLocaleString() + "đ";
}

function starsHtml(n){
  let s = "";
  for(let i=0;i<5;i++) s += (i<n ? "★" : "☆");
  return s;
}

    html += '<div class="info-card"><div class="icon">🍶</div><div class="body">';

    if(item.note) html += '<div class="note">' + item.note[LANG] + '</div>';
    html += '<div class="price">' + item.price.toLocaleString() + 'đ</div>';
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

function renderAboutPage(){
  let html = '<div class="info-page">';
  html += '<h2>' + ABOUT_INFO.headline[LANG] + '</h2>';
  html += '<p>' + ABOUT_INFO.intro[LANG] + '</p>';
  ABOUT_INFO.cards.forEach(function(card){
    html += '<div class="info-card"><div class="icon">' + card.icon + '</div><div class="body">';
    html += '<div class="name">' + card.t[LANG] + '</div>';
    html += '<div class="desc">' + card.s[LANG] + '</div>';
    html += '</div></div>';
  });
  html += '<h2>⭐️ ' + ABOUT_INFO.reviewCtaLabel[LANG] + '</h2>';
  html += '<p>' + ABOUT_INFO.reviewCtaSub[LANG] + '</p>';
  html += '<p style="text-align:center;font-size:18px;margin:6px 0 12px;">⭐️⭐️⭐️⭐️⭐️</p>';
  html += '<p style="text-align:center;"><a href="' + GOOGLE_REVIEW_URL + '" target="_blank" rel="noopener" style="display:inline-block;background:var(--wine);color:#fff;font-weight:700;padding:12px 24px;border-radius:999px;text-decoration:none;font-size:14px;">' + ABOUT_INFO.reviewCtaLabel[LANG] + '</a></p>';
  html += '<p style="text-align:center;margin-top:16px;">🍢 ' + ABOUT_INFO.reviewThanksNote[LANG] + '</p>';
  html += '<h2>' + ABOUT_INFO.addressLabel[LANG] + '</h2><p>' + ABOUT_INFO.address + '</p>';
  html += '<h2>' + ABOUT_INFO.hotlineLabel[LANG] + '</h2><p>' + ABOUT_INFO.hotline + '</p>';
  html += '</div>';
  return html;
}

let currentPage = "menu";
function switchPage(page){
  currentPage = page;
  document.getElementById("pageTabMenu").classList.toggle("active", page === "menu");
  document.getElementById("pageTabSake").classList.toggle("active", page === "sake");
  document.getElementById("pageTabOsusume").classList.toggle("active", page === "osusume");
  document.getElementById("pageTabAbout").classList.toggle("active", page === "about");

  const tabsEl2 = document.getElementById("tabs");
  const menuRootEl = document.getElementById("menuRoot");
  const infoRootEl = document.getElementById("infoRoot");
  const quickActionsEl = document.querySelector(".quick-actions");

  if(page === "menu"){
    tabsEl2.style.display = "";
    menuRootEl.style.display = "";
    infoRootEl.style.display = "none";
    quickActionsEl.style.display = "";
  } else {
    tabsEl2.style.display = "none";
    menuRootEl.style.display = "none";
    quickActionsEl.style.display = "none";
    infoRootEl.style.display = "";
    renderInfoPage();
  }
  window.scrollTo({top:0});
}

function renderInfoPage(){
  const infoRootEl = document.getElementById("infoRoot");
  if(currentPage === "sake") infoRootEl.innerHTML = renderSakePage();
  else if(currentPage === "osusume") infoRootEl.innerHTML = renderOsusumePage();
  else if(currentPage === "about") infoRootEl.innerHTML = renderAboutPage();
}

updateBar();
</script>
