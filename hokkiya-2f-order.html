<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>北寄や 2階オーダー</title>
<style>
  :root{
    --cream:#FBF1DE;
    --cream-deep:#F3E4C2;
    --wine:#7A1F1F;
    --wine-deep:#5C1414;
    --ember:#C1440E;
    --ink:#3A2A1E;
    --ink-soft:#8A7860;
    --line:#E3CFa0;
    --gold:#D9A441;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    padding-bottom:96px;
    min-height:100vh;
  }
  .lang-bar{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:10px 12px;
    background:var(--cream-deep);
    scrollbar-width:none;
  }
  .lang-bar::-webkit-scrollbar{display:none;}
  .lang-pill{
    flex:none;
    padding:6px 14px;
    border-radius:999px;
    border:1.5px solid var(--wine);
    background:#fff;
    color:var(--wine);
    font-size:12.5px;
    font-weight:700;
  }
  .lang-pill.active{background:var(--wine);color:#fff;}

  header{
    background:var(--wine);
    color:#fff;
    padding:18px 16px 14px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header .brand{display:flex;align-items:baseline;gap:8px;}
  header .brand .mark{font-size:20px;}
  header h1{font-size:19px;margin:0;letter-spacing:.04em;font-weight:700;}
  header .sub{margin:4px 0 0;font-size:12px;color:#E8C9A0;letter-spacing:.06em;}
  header .seat-badge{
    position:absolute;top:16px;right:16px;
    background:var(--gold);color:var(--wine-deep);
    font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;
  }

  .tabs{
    position:sticky;top:98px;z-index:19;
    display:flex;gap:8px;overflow-x:auto;
    padding:12px 14px;background:var(--cream);
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;padding:9px 16px;border-radius:999px;
    border:1.5px solid var(--wine);color:var(--wine);
    background:#fff;font-size:14px;font-weight:700;white-space:nowrap;
  }
  .tab.active{background:var(--wine);color:#fff;}

  .cat-head{display:flex;align-items:center;gap:8px;margin:22px 16px 10px;color:var(--wine);}
  .cat-head .mark{font-size:18px;}
  .cat-head h2{font-size:16px;margin:0;font-weight:700;letter-spacing:.03em;}
  .cat-head::after{content:"";flex:1;border-bottom:2px dashed var(--gold);margin-left:4px;}
  .subgroup-label{margin:14px 16px 6px;font-size:13px;font-weight:700;color:var(--ember);}

  .items{padding:0 12px;}
  .item{
    display:flex;align-items:center;gap:12px;background:#fff;
    border-radius:16px;padding:12px;margin-bottom:10px;border:1px solid var(--line);
  }
  .item .icon{
    width:52px;height:52px;border-radius:12px;background:var(--cream-deep);
    display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;
    overflow:hidden;
  }
  .item .icon img{
    width:100%;height:100%;object-fit:cover;
    display:block;
  }
  .item .info{flex:1;min-width:0;}
  .item .name{font-size:15px;font-weight:700;line-height:1.3;}
  .item .price{font-size:13px;color:var(--ember);font-weight:700;margin-top:2px;}
  .stepper{display:flex;align-items:center;flex:none;border:1.5px solid var(--wine);border-radius:999px;overflow:hidden;}
  .stepper button{width:32px;height:32px;border:none;background:#fff;color:var(--wine);font-size:18px;font-weight:700;line-height:1;}
  .stepper button:active{background:var(--cream-deep);}
  .stepper .qty{width:26px;text-align:center;font-weight:700;font-size:14px;}
  .item.has-qty{background:#FFF8EA;border-color:var(--gold);}

  .bottombar{
    position:fixed;bottom:0;left:0;right:0;background:var(--wine);color:#fff;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:12px;z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,.2);
  }
  .bottombar .count{font-size:13px;color:#E8C9A0;}
  .bottombar .total{font-size:17px;font-weight:700;}
  .bottombar button{
    margin-left:auto;background:var(--gold);color:var(--wine-deep);border:none;
    font-weight:700;font-size:15px;padding:12px 22px;border-radius:999px;
  }
  .bottombar button:disabled{background:#8a7860;color:#d8cdb8;}

  .seat-screen{
    position:fixed;inset:0;background:var(--wine);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;z-index:50;padding:24px;text-align:center;
  }
  .lang-bar-seat{
    position:absolute;
    top:0;left:0;right:0;
    background:transparent;
    justify-content:center;
    padding:14px 12px;
  }
  .lang-bar-seat .lang-pill{
    border-color:var(--gold);
    background:rgba(255,255,255,.08);
    color:#fff;
  }
  .lang-bar-seat .lang-pill.active{
    background:var(--gold);
    color:var(--wine-deep);
  }
  .seat-screen{position:fixed;}
  .seat-screen .mark{font-size:40px;}
  .seat-screen h2{margin:0;font-size:20px;letter-spacing:.04em;}
  .seat-screen p{margin:0;color:#E8C9A0;font-size:14px;}
  .seat-options{display:flex;gap:16px;}
  .seat-options button{
    width:120px;height:120px;border-radius:20px;border:2px solid var(--gold);
    background:rgba(255,255,255,.06);color:#fff;font-size:20px;font-weight:700;
  }
  .seat-options button:active{background:var(--gold);color:var(--wine-deep);}

  .overlay{
    position:fixed;inset:0;background:rgba(58,42,30,.55);
    display:none;align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:#fff;border-radius:20px;max-width:380px;width:100%;
    max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .sheet header{background:var(--wine);position:static;box-shadow:none;padding:16px;}
  .sheet header h3{margin:0;font-size:16px;}
  .sheet .list{padding:12px 16px;overflow-y:auto;flex:1;}
  .sheet .row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);}
  .sheet .row .n{font-weight:700;}
  .sheet .total-row{
    display:flex;justify-content:space-between;padding:14px 16px;
    font-weight:700;font-size:16px;color:var(--wine);border-top:2px solid var(--line);
  }
  .sheet .actions{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));}
  .sheet .actions button{flex:1;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:15px;}
  .btn-cancel{background:var(--cream-deep);color:var(--ink);}
  .btn-send{background:var(--wine);color:#fff;}
  .btn-send:disabled{background:#b8a68c;}

  .success-screen{
    position:fixed;inset:0;background:var(--wine);color:#fff;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:70;padding:24px;text-align:center;
  }
  .success-screen.show{display:flex;}
  .success-screen .mark{font-size:52px;}
  .success-screen h2{margin:0;font-size:20px;}
  .success-screen p{margin:0;color:#E8C9A0;font-size:14px;}
  .success-screen button{
    margin-top:12px;background:var(--gold);color:var(--wine-deep);border:none;
    font-weight:700;padding:12px 26px;border-radius:999px;font-size:15px;
  }
  .error-msg{color:#ffd7d7;font-size:13px;margin-top:8px;}
</style>
</head>

<div class="seat-screen" id="seatScreen">
  <div class="lang-bar lang-bar-seat" id="langBarSeat"></div>
  <div class="mark">🐻</div>
  <h2 id="seatTitle">2階のお席をお選びください</h2>
  <p id="seatDesc">お座りのテーブル番号を選んでください</p>
  <div class="seat-options">
    <button onclick="chooseSeat('1')">1</button>
    <button onclick="chooseSeat('2')">2</button>
  </div>
</div>

<div class="lang-bar" id="langBar"></div>

<header>
  <div class="brand">
    <span class="mark">🏮</span>
    <div>
      <h1>北寄や HOKKIYA</h1>
      <p class="sub" id="headerSub">2階オーダー</p>
    </div>
  </div>
  <div class="seat-badge" id="seatBadge">-</div>
</header>

<div class="tabs" id="tabs"></div>
<div id="menuRoot"></div>

<div class="bottombar">
  <div>
    <div class="count" id="countLabel">0</div>
    <div class="total" id="totalLabel">0đ</div>
  </div>
  <button id="reviewBtn" disabled onclick="openReview()"></button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <header><h3 id="reviewTitle">🐻 ご注文内容</h3></header>
    <div class="list" id="reviewList"></div>
    <div class="total-row"><span id="reviewTotalLabel">合計</span><span id="reviewTotal">0đ</span></div>
    <div class="actions">
      <button class="btn-cancel" id="backBtn" onclick="closeReview()">戻る</button>
      <button class="btn-send" id="sendBtn" onclick="sendOrder()">この内容で注文する</button>
    </div>
    <div class="error-msg" id="errorMsg" style="display:none;padding:0 16px 12px;"></div>
  </div>
</div>

<div class="success-screen" id="successScreen">
  <div class="mark">✅</div>
  <h2 id="successTitle">ご注文ありがとうございます</h2>
  <p id="successDesc">スタッフがすぐに参ります。<br>少々お待ちください。</p>
  <button onclick="resetOrder()" id="continueBtn">続けて注文する</button>
</div>

let seat = null;
const cart = {};
const nameEls = {};
const catHeadEls = [];
const tabEls = [];
const groupLabelEls = [];

const langBar = document.getElementById("langBar");
const langBarSeat = document.getElementById("langBarSeat");
[langBar, langBarSeat].forEach(function(bar){
  LANGS.forEach(function(l){
    const b = document.createElement("button");
    b.className = "lang-pill" + (l===LANG ? " active" : "");
    b.textContent = LANG_LABEL[l];
    b.onclick = function(){ setLang(l); };
    b.setAttribute("data-lang", l);
    bar.appendChild(b);
  });
});

function setLang(l){
  LANG = l;
  document.querySelectorAll(".lang-pill").forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-lang")===l);
  });
  document.getElementById("headerSub").textContent = STR.headerSub[l];
  document.getElementById("seatTitle").textContent = STR.seatTitle[l];
  document.getElementById("seatDesc").textContent = STR.seatDesc[l];
  document.getElementById("reviewBtn").textContent = STR.reviewBtn[l];
  document.getElementById("reviewTitle").textContent = STR.reviewTitle[l];
  document.getElementById("reviewTotalLabel").textContent = STR.reviewTotalLabel[l];
  document.getElementById("backBtn").textContent = STR.backBtn[l];
  document.getElementById("successTitle").textContent = STR.successTitle[l];
  document.getElementById("successDesc").innerHTML = STR.successDesc[l];
  document.getElementById("continueBtn").textContent = STR.continueBtn[l];
  if(seat) document.getElementById("seatBadge").textContent = seat + STR.seatBadgeSuffix[l];

  Object.keys(nameEls).forEach(function(id){ nameEls[id].textContent = cart[id].names[l]; });
  catHeadEls.forEach(function(o){ o.el.textContent = o.n[l]; });
  tabEls.forEach(function(o){ o.el.textContent = o.n[l]; });
  groupLabelEls.forEach(function(o){ o.el.textContent = o.n[l]; });

  updateBar();
}

function chooseSeat(s){
  seat = s;
  document.getElementById("seatBadge").textContent = s + STR.seatBadgeSuffix[LANG];
  document.getElementById("seatScreen").style.display = "none";
}
(function initSeatFromUrl(){
  const p = new URLSearchParams(location.search).get("seat");
  if(p === "1" || p === "2") chooseSeat(p);
})();

const tabsEl = document.getElementById("tabs");
const rootEl = document.getElementById("menuRoot");
let itemCounter = 0;

MENU.forEach(function(cat, ci){
  const tab = document.createElement("button");
  tab.className = "tab" + (ci===0 ? " active" : "");
  tab.textContent = cat.cat[LANG];
  tab.onclick = function(){ scrollToCat(ci); };
  tab.id = "tab-" + ci;
  tabsEl.appendChild(tab);
  tabEls.push({el:tab, n:cat.cat});

  const head = document.createElement("div");
  head.className = "cat-head";
  head.id = "cat-" + ci;
  const headMark = document.createElement("span");
  headMark.className = "mark"; headMark.textContent = cat.icon;
  const headTxt = document.createElement("h2");
  headTxt.textContent = cat.cat[LANG];
  head.appendChild(headMark); head.appendChild(headTxt);
  rootEl.appendChild(head);
  catHeadEls.push({el:headTxt, n:cat.cat});

  function renderItems(items){
    const wrap = document.createElement("div");
    wrap.className = "items";
    items.forEach(function(pair){
      const names = pair[0], price = pair[1], img = pair[2];
      itemCounter++;
      const id = "item-" + itemCounter;
      cart[id] = { names:names, price:price, qty: 0 };
      const row = document.createElement("div");
      row.className = "item";
      row.id = "row-" + id;

      const icon = document.createElement("div");
      icon.className = "icon";
      if(img){
        const im = document.createElement("img");
        im.src = IMG_BASE + img;
        im.alt = names.ja;
        im.loading = "lazy";
        icon.appendChild(im);
      } else {
        icon.textContent = cat.icon;
      }

      const info = document.createElement("div");
      info.className = "info";
      const nameEl = document.createElement("div");
      nameEl.className = "name"; nameEl.textContent = names[LANG];
      const priceEl = document.createElement("div");
      priceEl.className = "price"; priceEl.textContent = price.toLocaleString() + "đ";
      info.appendChild(nameEl); info.appendChild(priceEl);
      nameEls[id] = nameEl;

      const stepper = document.createElement("div");
      stepper.className = "stepper";
      stepper.innerHTML = '<button onclick="changeQty(\''+id+'\',-1)">−</button><span class="qty" id="qty-'+id+'">0</span><button onclick="changeQty(\''+id+'\',1)">＋</button>';

      row.appendChild(icon); row.appendChild(info); row.appendChild(stepper);
      wrap.appendChild(row);
    });
    rootEl.appendChild(wrap);
  }

  if(cat.groups){
    cat.groups.forEach(function(g){
      const label = document.createElement("div");
      label.className = "subgroup-label";
      label.textContent = g.label[LANG];
      rootEl.appendChild(label);
      groupLabelEls.push({el:label, n:g.label});
      renderItems(g.items);
    });
  } else {
    renderItems(cat.items);
  }
});

function scrollToCat(i){
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("tab-"+i).classList.add("active");
  const el = document.getElementById("cat-"+i);
  const y = el.getBoundingClientRect().top + window.scrollY - 150;
  window.scrollTo({top:y, behavior:"smooth"});
}

function changeQty(id, delta){
  const it = cart[id];
  it.qty = Math.max(0, it.qty + delta);
  document.getElementById("qty-"+id).textContent = it.qty;
  document.getElementById("row-"+id).classList.toggle("has-qty", it.qty > 0);
  updateBar();
}

function updateBar(){
  let count = 0, total = 0;
  Object.values(cart).forEach(function(it){ count += it.qty; total += it.qty * it.price; });
  document.getElementById("countLabel").textContent = STR.countLabel[LANG](count);
  document.getElementById("totalLabel").textContent = total.toLocaleString() + "đ";
  document.getElementById("reviewBtn").disabled = count === 0;
  document.getElementById("reviewBtn").textContent = STR.reviewBtn[LANG];
}

function openReview(){
  if(!seat){
    document.getElementById("seatScreen").style.display = "flex";
    return;
  }
  const list = document.getElementById("reviewList");
  list.innerHTML = "";
  let total = 0;
  Object.values(cart).forEach(function(it){
    if(it.qty > 0){
      total += it.qty * it.price;
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = '<span>'+it.names[LANG]+' × '+it.qty+'</span><span class="n">'+(it.price*it.qty).toLocaleString()+'đ</span>';
      list.appendChild(row);
    }
  });
  document.getElementById("reviewTotal").textContent = total.toLocaleString() + "đ";
  document.getElementById("errorMsg").style.display = "none";
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("sendBtn").textContent = STR.sendBtn[LANG];
  document.getElementById("overlay").classList.add("show");
}
function closeReview(){
  document.getElementById("overlay").classList.remove("show");
}

async function sendOrder(){
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  btn.textContent = STR.sending[LANG];

  let lines = [];
  let total = 0;
  Object.values(cart).forEach(function(it){
    if(it.qty > 0){
      lines.push("・"+it.names.ja+" / "+it.names.vi+" ×"+it.qty);
      total += it.qty * it.price;
    }
  });

  const text = "🔔 " + STR.orderNotifyTitle.ja + " / " + STR.orderNotifyTitle.vi + "\n" +
    STR.seatWord.ja + "/" + STR.seatWord.vi + ": " + seat + "番\n\n" +
    lines.join("\n") +
    "\n\n" + STR.totalWord.ja + "/" + STR.totalWord.vi + ": " + total.toLocaleString() + "đ";

  try{
    const res = await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.description || "send failed");

    document.getElementById("overlay").classList.remove("show");
    document.getElementById("successScreen").classList.add("show");
  } catch(err){
    document.getElementById("errorMsg").textContent = STR.errorMsg[LANG](err.message);
    document.getElementById("errorMsg").style.display = "block";
    btn.disabled = false;
    btn.textContent = STR.sendBtn[LANG];
  }
}

function resetOrder(){
  Object.keys(cart).forEach(function(id){
    cart[id].qty = 0;
    document.getElementById("qty-"+id).textContent = 0;
    document.getElementById("row-"+id).classList.remove("has-qty");
  });
  updateBar();
  document.getElementById("successScreen").classList.remove("show");
  window.scrollTo({top:0});
}

updateBar();
