<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>HOKKIYA 在庫</title>
<style>
:root{--bg:#f5f3ef;--surface:#fff;--navy:#1a1a2e;--accent:#c8a96e;--danger:#c0392b;--danger-bg:#fdf0ee;--warn:#e67e22;--warn-bg:#fef9e7;--ok:#27ae60;--text:#1a1a2e;--sub:#6b6b8a;--border:#e0ddd6;--nav-h:68px;--r:12px;--rsm:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:var(--nav-h);font-size:15px;line-height:1.5}
/* header */
.app-header{background:var(--navy);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
#hdr-sub{font-size:11px;color:var(--accent);margin-top:1px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--navy);display:flex;z-index:200;border-top:2px solid var(--accent)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(255,255,255,.45);background:none;border:none;cursor:pointer;padding:4px 2px}
.nb.active{color:var(--accent)}
.nb .ic{font-size:20px;line-height:1}
.nb .m{font-size:10px}.nb .s{font-size:9px;opacity:.8}
/* screens */
.screen{display:none;padding:12px}.screen.active{display:block}
/* stock items */
.stock-list{display:flex;flex-direction:column;gap:8px}
.si{background:var(--surface);border-radius:var(--r);border-left:4px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;overflow:hidden}
.si.danger{border-left-color:var(--danger);background:var(--danger-bg)}
.si.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.si.checked{border-left-color:var(--navy);background:#f0f7ff}
.si-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.si-body{display:none;padding:0 16px 14px;border-top:1px solid var(--border)}
.si-body.open{display:block}
.nm{font-size:15px;font-weight:600}.ns{font-size:12px;color:var(--sub);margin-top:1px}
.sq{font-size:28px;font-weight:800;min-width:44px;text-align:right;color:var(--navy)}
.si.danger .sq{color:var(--danger)}.si.warn .sq{color:var(--warn)}.si.checked .sq{color:var(--navy)}
/* checkbox */
.chk{width:26px;height:26px;border-radius:6px;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff}
.chk.on{background:var(--navy);border-color:var(--navy)}
/* stepper */
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:var(--rsm);overflow:hidden;border:1.5px solid var(--border)}
.stb{width:54px;height:54px;background:none;border:none;font-size:28px;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stb:active{background:var(--border)}
.stv{flex:1;text-align:center;font-size:28px;font-weight:800;color:var(--navy);min-width:60px}
/* buttons */
.btn{display:block;width:100%;padding:16px;border-radius:var(--r);border:none;font-size:16px;font-weight:700;cursor:pointer;text-align:center}
.btn:active{opacity:.85}
.btn-p{background:var(--navy);color:#fff}
.btn-a{background:var(--accent);color:var(--navy)}
.btn-g{background:transparent;color:var(--navy);border:2px solid var(--border)}
.btn-d{background:var(--danger);color:#fff}
.btn-sm{padding:10px 16px;font-size:14px}
/* search */
.srch{position:relative;margin-bottom:8px}
.srch input{width:100%;padding:12px 14px 12px 38px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:15px;background:var(--surface);color:var(--text);outline:none}
.srch-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
/* delivery/sales items */
.di{background:var(--surface);border-radius:var(--r);margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.di-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.sli{background:var(--surface);border-radius:var(--r);margin-bottom:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
/* admin */
.adm-sec{background:var(--surface);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.adm-hdr{padding:14px 16px;font-weight:700;border-bottom:1px solid var(--border);cursor:pointer}
.adm-body{padding:16px}
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px;display:block}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:15px;background:var(--bg);color:var(--text);outline:none}
.fi:focus{border-color:var(--accent)}
.pr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.pr:last-child{border-bottom:none}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:#eafaf1;color:var(--ok)}
.badge.off{background:#f5f5f5;color:#999}
.hi{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.hi:last-child{border-bottom:none}
/* screenshot */
#ssv{display:none;position:fixed;inset:0;background:#fff;z-index:500;padding:32px 24px;overflow-y:auto}
#ssv.open{display:block}
.ss-hdr{text-align:center;margin-bottom:24px}
.ss-logo{font-size:28px;font-weight:900;letter-spacing:.12em}
.ss-sub{font-size:14px;color:#555;margin-top:4px}
.ss-date{font-size:13px;color:#888;margin-top:2px}
.ss-table{width:100%;border-collapse:collapse;margin:20px 0}
.ss-table tr{border-bottom:1px solid #eee}
.ss-table td{padding:12px 4px}
.iq{font-size:24px;font-weight:900;text-align:right;min-width:48px}
.ss-close{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border:none;border-radius:40px;padding:14px 36px;font-size:15px;font-weight:700;cursor:pointer}
/* overlays */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.ov-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.ov-title{font-size:17px;font-weight:700;margin-bottom:4px}
.ov-sub{font-size:12px;color:var(--sub);margin-bottom:16px}
/* confirm */
#conf{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;align-items:flex-end;justify-content:center}
#conf.open{display:flex}
.conf-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 16px 36px;width:100%;max-width:480px}
#conf-title{font-size:17px;font-weight:700;margin-bottom:6px}
#conf-body{font-size:14px;color:var(--sub);margin-bottom:20px;white-space:pre-wrap}
.conf-acts{display:flex;gap:10px}
.conf-acts .btn{flex:1}
/* init */
#initov{position:fixed;inset:0;background:var(--bg);z-index:700;overflow-y:auto;display:none}
#initov.open{display:block}
.init-hdr{background:var(--navy);color:#fff;padding:20px 16px;text-align:center}
/* toast */
#toast{position:fixed;bottom:calc(var(--nav-h)+12px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:40px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1}
/* result items */
.ri{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ri:last-child{border-bottom:none}
.rbadge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;background:#eafaf1;color:var(--ok)}
/* sticky buttons */
.sticky-btns{position:sticky;bottom:calc(var(--nav-h)+8px);padding:10px 0;background:var(--bg)}
.ut{font-size:11px;color:var(--sub)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
</style>
</head>
<body>

<div id="ssv">

  </div>
</div>

<!-- Delivery paste overlay -->
<div id="del-ov" class="ov">

    <div class="ov-title" id="del-ov-title"></div>
    <div class="ov-sub" id="del-ov-sub"></div>
    <div id="del-ov-body"></div>
    <div class="mt8"><button class="btn btn-g" id="del-ov-cancel" onclick="closeDelOv()"></button></div>

<!-- Sales paste overlay -->
<div id="sale-ov" class="ov">

    <div class="ov-title" id="sale-ov-title"></div>
    <div class="ov-sub" id="sale-ov-sub"></div>
    <div id="sale-ov-body"></div>
    <div class="mt8"><button class="btn btn-g" id="sale-ov-cancel" onclick="closeSaleOv()"></button></div>
  </div>
</div>

<!-- Confirm dialog -->
<div id="conf">
  <div class="conf-sheet">
    <div id="conf-title"></div>
    <div id="conf-body"></div>
    <div class="conf-acts">
      <button class="btn btn-g" id="conf-cancel" onclick="closeConf()"></button>
      <button class="btn btn-p" id="conf-ok" onclick="doConf()"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
// STORAGE
// ════════════════════════════════════════════════════════════
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
};
const loadProds = () => LS.get('hk_products') || [];
const saveProds = p => LS.set('hk_products', p);
const loadEvts  = () => LS.get('hk_events')  || [];
const saveEvts  = e => LS.set('hk_events', e);

function addEvt(type, items, note) {
  const evts = loadEvts();
  evts.push({ id: Date.now().toString(), type, at: new Date().toISOString(), items, note: note || '' });
  saveEvts(evts);
}

function calcStock(pid) {
  let qty = 0;
  for (const ev of loadEvts()) {
    const it = (ev.items || []).find(i => i.productId === pid);
    if (!it) continue;
    if (ev.type === 'init' || ev.type === 'adjust') qty = it.qty;
    if (ev.type === 'delivery') qty += it.qty;
    if (ev.type === 'sale')     qty -= it.qty;
  }
  return Math.max(0, qty);
}

function stocksMap() {
  const m = {};
  for (const p of loadProds()) m[p.id] = calcStock(p.id);
  return m;
}

function t(key, ...args) {
  const val = T[lang][key];
  if (val === undefined) return key;
  return typeof val === 'function' ? val(...args) : val;
}
function pname(p)    { return lang === 'vi' ? p.nameVi : p.nameJa; }
function pnamesub(p) { return lang === 'vi' ? (p.nameRo || p.nameJa) : p.nameVi; }

function toggleLang() {
  lang = lang === 'vi' ? 'ja' : 'vi';
  LS.set('hk_lang', lang);
  applyLangUI();
  const active = document.querySelector('.nb.active');
  if (active) render(active.dataset.s);
}

function applyLangUI() {
  document.getElementById('hdr-sub').textContent = t('hdrSub');
  document.getElementById('lang-btn').textContent = t('langBtn');
  const navKeys = [
    ['stock',    'navStock',  'navStockSub'],
    ['delivery', 'navDel',    'navDelSub'],
    ['sales',    'navSale',   'navSaleSub'],
    ['admin',    'navAdmin',  'navAdminSub'],
  ];
  navKeys.forEach(([s, mk, sk]) => {
    const btn = document.querySelector(`.nb[data-s="${s}"]`);
    if (!btn) return;
    btn.querySelector('.m').textContent = t(mk);
    btn.querySelector('.s').textContent = t(sk);
  });
}

// BOOT / INIT
// ════════════════════════════════════════════════════════════
function boot() {
  // Seed products if empty
  if (!loadProds().length) saveProds(DEFAULT_PRODUCTS.map(p => ({...p})));
  // Migration: add nameRo if missing
  const prods = loadProds();
  let changed = false;
  prods.forEach(p => {
    if (!p.nameRo) {
      const def = DEFAULT_PRODUCTS.find(d => d.id === p.id);
      if (def) { p.nameRo = def.nameRo; changed = true; }
    }
  });
  if (changed) saveProds(prods);
  // Apply language UI
  applyLangUI();
  // Show init if no init event
  if (!loadEvts().some(e => e.type === 'init')) {
    showInitOverlay();
  }
}

function showInitOverlay() {
  document.getElementById('init-title').textContent = t('initTitle');
  document.getElementById('init-sub').textContent   = t('initSub');
  document.getElementById('init-hint').textContent  = t('initHint');
  document.getElementById('init-done').textContent  = t('btnInitDone');
  const prods = loadProds().filter(p => p.active);
  document.getElementById('init-list').innerHTML = prods.map(p => `
    <div class="sli">
      <div style="flex:1"><div class="nm">${pname(p)}</div><div class="ns">${pnamesub(p)}</div></div>
      <div class="stepper">
        <button class="stb" onclick="stepInit('${p.id}',-1)">−</button>
        <div class="stv" id="iv-${p.id}">0</div>
        <button class="stb" onclick="stepInit('${p.id}',1)">＋</button>
      </div>
    </div>`).join('');
  document.getElementById('initov').classList.add('open');
}

const iVals = {};
function stepInit(id, d) {
  iVals[id] = Math.max(0, (iVals[id] || 0) + d);
  const el = document.getElementById('iv-' + id);
  if (el) el.textContent = iVals[id];
}
function completeInit() {
  const items = loadProds().filter(p => p.active).map(p => ({ productId: p.id, qty: iVals[p.id] || 0 }));
  addEvt('init', items, '初回在庫登録');
  document.getElementById('initov').classList.remove('open');
  toast(t('toastInit'));
  render('stock');
}

function go(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelector(`.nb[data-s="${name}"]`).classList.add('active');
  render(name);
}
function render(name) {
  if (name === 'stock')    renderStock();
  if (name === 'delivery') renderDelivery();
  if (name === 'sales')    renderSales();
  if (name === 'admin')    renderAdmin();
}

// STOCK + REPORT
// ════════════════════════════════════════════════════════════
const rVals = {}, rChk = {};

function renderStock() {
  const prods = loadProds().filter(p => p.active);
  const sm = stocksMap();
  const sorted = [...prods].sort((a, b) => (sm[a.id] || 0) - (sm[b.id] || 0));
  // Sync rVals with current stock for unchecked items only
  prods.forEach(p => {
    if (!rChk[p.id]) rVals[p.id] = sm[p.id] || 0;
  });
  const anyChecked = Object.values(rChk).some(v => v);
  document.getElementById('screen-stock').innerHTML = `
    <div class="srch"><span class="srch-ic">🔍</span>
      <input type="text" placeholder="${t('searchPH')}" oninput="filterStock(this.value)">
    </div>
    <p style="font-size:11px;color:var(--sub);margin-bottom:10px">${t('stockHint')}</p>
    <div class="stock-list" id="sl">${sorted.map(p => stockItemHTML(p, sm[p.id] || 0)).join('')}</div>
    <div id="ss-btns" class="sticky-btns" style="display:${anyChecked ? 'block' : 'none'}">
      <button class="btn btn-a" onclick="genSS()">${t('btnSS')}</button>
      <div class="mt8"><button class="btn btn-p" onclick="submitReport()">${t('btnUpdate')}</button></div>
    </div>`;
}

function stockItemHTML(p, qty) {
  const cls = qty === 0 ? 'danger' : qty <= p.warnAt ? 'warn' : '';
  const on = !!rChk[p.id];
  // rVals already synced in renderStock; use it directly
  const dispVal = rVals[p.id] !== undefined ? rVals[p.id] : qty;
  return `
    <div class="si ${cls} ${on ? 'checked' : ''}" id="si-${p.id}" data-n="${p.nameJa} ${p.nameVi}" style="flex-direction:column;align-items:stretch">
      <div class="si-top" onclick="togSR('${p.id}',${qty})">
        <div class="chk ${on ? 'on' : ''}" id="chk-${p.id}">✓</div>
        <div style="flex:1"><div class="nm">${pname(p)}</div><div class="ns">${pnamesub(p)}</div></div>
        <div class="sq">${qty}</div>
      </div>
      <div class="si-body ${on ? 'open' : ''}" id="sib-${p.id}">
        <p style="font-size:11px;color:var(--sub);margin:8px 0 6px">${t('actualQty')}</p>
        <div class="stepper">
          <button class="stb" onclick="stepSR('${p.id}',-1)">−</button>
          <div class="stv" id="srv-${p.id}">${dispVal}</div>
          <button class="stb" onclick="stepSR('${p.id}',1)">＋</button>
        </div>
      </div>
    </div>`;
}

function togSR(id, estQty) {
  rChk[id] = !rChk[id];
  if (!(id in rVals)) rVals[id] = estQty;
  document.getElementById('chk-' + id).classList.toggle('on', rChk[id]);
  document.getElementById('sib-' + id).classList.toggle('open', rChk[id]);
  document.getElementById('si-' + id).classList.toggle('checked', rChk[id]);
  const any = Object.values(rChk).some(v => v);
  document.getElementById('ss-btns').style.display = any ? 'block' : 'none';
}

function stepSR(id, d) {
  rVals[id] = Math.max(0, (rVals[id] || 0) + d);
  const el = document.getElementById('srv-' + id);
  if (el) el.textContent = rVals[id];
}

function filterStock(q) {
  document.querySelectorAll('#sl .si').forEach(el => {
    el.style.display = el.dataset.n.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

function genSS() {
  const ids = Object.keys(rChk).filter(id => rChk[id]);
  if (!ids.length) { toast(t('needSelect')); return; }
  const prods = loadProds();
  const now = new Date();
  const daysVi = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  const daysJa = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
  const day = lang === 'vi' ? daysVi[now.getDay()] : daysJa[now.getDay()];
  const dd = now.getDate().toString().padStart(2,'0');
  const mm = (now.getMonth()+1).toString().padStart(2,'0');
  document.getElementById('ss-date').textContent = `${day}, ${dd}/${mm}/${now.getFullYear()}`;
  document.getElementById('ss-title').textContent = t('ssTitle');
  document.getElementById('ss-msg').textContent   = t('ssMsg');
  document.getElementById('ss-close-btn').textContent = t('ssClose');
  document.getElementById('ss-table').innerHTML = ids.map(id => {
    const p = prods.find(x => x.id === id);
    if (!p) return '';
    return `<tr><td><div class="nm">${pname(p)}</div><div style="font-size:11px;color:#999">${pnamesub(p)}</div></td><td class="iq">${rVals[id] ?? 0}</td></tr>`;
  }).join('');
  document.getElementById('ssv').classList.add('open');
}

function submitReport() {
  const ids = Object.keys(rChk).filter(id => rChk[id]);
  if (!ids.length) { toast(t('needSelect')); return; }
  confirm2(t('confUpdate'), t('confUpdateBody', ids.length), () => {
    addEvt('adjust', ids.map(id => ({ productId: id, qty: rVals[id] || 0 })), '残数報告');
    ids.forEach(id => { delete rChk[id]; delete rVals[id]; });
    toast(t('toastUpdated'));
    renderStock();
  });
}

// DELIVERY
// ════════════════════════════════════════════════════════════
const dVals = {}, dChk = {};

function renderDelivery() {
  const prods = loadProds().filter(p => p.active);
  const lastAdj = [...loadEvts()].reverse().find(e => e.type === 'adjust');
  let items = lastAdj
    ? lastAdj.items.map(i => prods.find(p => p.id === i.productId)).filter(Boolean)
    : prods;
  items.forEach(p => { if (!(p.id in dVals)) dVals[p.id] = 0; });

  document.getElementById('screen-delivery').innerHTML = `
    <div class="mt8" style="margin-bottom:14px">
      <button class="btn btn-a" onclick="openDelOv()">${t('delPasteBtn')}</button>
    </div>
    <p style="font-size:12px;color:var(--sub);margin-bottom:4px">${t('delHint')}</p>
    ${lastAdj ? `<p style="font-size:11px;color:var(--sub);margin-bottom:12px">${t('delFrom')}</p>` : ''}
    <div id="dl">${items.map(p => delItemHTML(p)).join('')}</div>
    <div id="d-add" class="mt8">
      <button class="btn btn-g btn-sm" onclick="showAllDel()">${t('delMore')}</button>
    </div>
    <div class="mt12">
      <button class="btn btn-p" onclick="submitDel()">${t('btnDelDone')}</button>
    </div>`;
}

function delItemHTML(p) {
  const on = !!dChk[p.id];
  return `<div class="di" id="di-${p.id}">
    <div class="di-row">
      <div class="chk ${on ? 'on' : ''}" id="dchk-${p.id}" onclick="togD('${p.id}')" style="cursor:pointer">✓</div>
      <div style="flex:1"><div class="nm">${pname(p)}</div><div class="ns">${pnamesub(p)}</div></div>
      <div class="stepper" style="width:auto">
        <button class="stb" style="width:46px;height:46px" onclick="stepD('${p.id}',-1)">−</button>
        <div class="stv" id="dv-${p.id}" style="font-size:22px;min-width:46px">${dVals[p.id] || 0}</div>
        <button class="stb" style="width:46px;height:46px" onclick="stepD('${p.id}',1)">＋</button>
      </div>
    </div>
  </div>`;
}

function togD(id) {
  dChk[id] = !dChk[id];
  const cb = document.getElementById('dchk-' + id);
  if (cb) cb.classList.toggle('on', dChk[id]);
}

function stepD(id, d) {
  dVals[id] = Math.max(0, (dVals[id] || 0) + d);
  const el = document.getElementById('dv-' + id);
  if (el) el.textContent = dVals[id];
  if (dVals[id] > 0 && !dChk[id]) {
    dChk[id] = true;
    const cb = document.getElementById('dchk-' + id);
    if (cb) cb.classList.add('on');
  }
}

function showAllDel() {
  const prods = loadProds().filter(p => p.active);
  const dl = document.getElementById('dl');
  prods.forEach(p => {
    if (!document.getElementById('di-' + p.id)) {
      dVals[p.id] = dVals[p.id] || 0;
      dl.insertAdjacentHTML('beforeend', delItemHTML(p));
    }
  });
  document.getElementById('d-add').style.display = 'none';
}

function submitDel() {
  const ids = Object.keys(dChk).filter(id => dChk[id] && dVals[id] > 0);
  if (!ids.length) { toast(t('needQty')); return; }
  confirm2(t('confDel'), t('confDelBody', ids.length), () => {
    addEvt('delivery', ids.map(id => ({ productId: id, qty: dVals[id] })), '納品確認');
    ids.forEach(id => { delete dChk[id]; dVals[id] = 0; });
    toast(t('toastDel'));
    go('stock');
  });
}

// Delivery paste overlay
function openDelOv() {
  document.getElementById('del-ov-title').textContent  = t('delOvTitle');
  document.getElementById('del-ov-sub').textContent    = t('delOvSub');
  document.getElementById('del-ov-cancel').textContent = t('cancel');
  document.getElementById('del-ov-body').innerHTML = `
    <textarea id="del-paste-ta" style="width:100%;height:160px;padding:12px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:15px;background:var(--bg);color:var(--text);resize:none;outline:none;font-family:inherit;margin-bottom:12px"
      placeholder="${t('delOvPH')}"></textarea>
    <button class="btn btn-p" onclick="parseDelText()">${t('readBtn')}</button>`;
  document.getElementById('del-ov').classList.add('open');
  setTimeout(() => { const ta = document.getElementById('del-paste-ta'); if (ta) ta.focus(); }, 200);
}

function closeDelOv() {
  document.getElementById('del-ov').classList.remove('open');
}

function parseDelText() {
  const text = (document.getElementById('del-paste-ta').value || '').trim();
  if (!text) { toast(t('needText')); return; }
  const result = parseItemText(text);
  if (!result.matched.length && !result.unmatched.length) { toast(t('noMatch')); return; }
  // Store matched
  window._delMatched = result.matched;
  document.getElementById('del-ov-body').innerHTML = buildResultHTML(result, 'del');
}

function stepDelResult(id, d) {
  const m = (window._delMatched || []).find(i => i.product.id === id);
  if (!m) return;
  m.qty = Math.max(0, m.qty + d);
  const el = document.getElementById('drv-' + id);
  if (el) el.textContent = m.qty;
}

function applyDelResult() {
  const items = (window._delMatched || []).filter(i => i.qty > 0).map(i => ({ productId: i.product.id, qty: i.qty }));
  if (!items.length) { toast(t('needQty')); return; }
  addEvt('delivery', items, '伝票テキスト納品');
  window._delMatched = null;
  closeDelOv();
  toast(t('toastDel'));
  go('stock');
}

// ════════════════════════════════════════════════════════════
// SALES
// ════════════════════════════════════════════════════════════
const sVals = {};

function renderSales() {
  const prods = loadProds().filter(p => p.active);
  const sm = stocksMap();
  const sorted = [...prods].sort((a, b) => a.nameJa.localeCompare(b.nameJa, 'ja'));
  document.getElementById('screen-sales').innerHTML = `
    <div class="mt8" style="margin-bottom:14px">
      <button class="btn btn-a" onclick="openSaleOv()">${t('salePasteBtn')}</button>
    </div>
    <p style="font-size:12px;color:var(--sub);margin-bottom:12px">${t('saleManual')}</p>
    <div>${sorted.map(p => {
      if (!(p.id in sVals)) sVals[p.id] = 0;
      return `<div class="sli">
        <div style="flex:1"><div class="nm">${pname(p)}</div><div class="ns">${pnamesub(p)}</div><div class="ut">${t('stockLbl')} ${sm[p.id] || 0} ${p.unit}</div></div>
        <div class="stepper">
          <button class="stb" onclick="stepS('${p.id}',-1)">−</button>
          <div class="stv" id="sv-${p.id}">${sVals[p.id]}</div>
          <button class="stb" onclick="stepS('${p.id}',1)">＋</button>
        </div>
      </div>`;
    }).join('')}</div>
    <div class="mt12">
      <button class="btn btn-p" onclick="submitSales()">${t('btnSaleDone')}</button>
    </div>`;
}

function stepS(id, d) {
  sVals[id] = Math.max(0, (sVals[id] || 0) + d);
  const el = document.getElementById('sv-' + id);
  if (el) el.textContent = sVals[id];
}

function submitSales() {
  const items = Object.entries(sVals).filter(([, q]) => q > 0).map(([pid, qty]) => ({ productId: pid, qty }));
  if (!items.length) { toast(t('needQty')); return; }
  confirm2(t('confSale'), t('confSaleBody', items.length), () => {
    addEvt('sale', items, '販売確定');
    items.forEach(i => { sVals[i.productId] = 0; });
    toast(t('toastSale'));
    go('stock');
  });
}

// Sales paste overlay
function openSaleOv() {
  document.getElementById('sale-ov-title').textContent  = t('saleOvTitle');
  document.getElementById('sale-ov-sub').textContent    = t('saleOvSub');
  document.getElementById('sale-ov-cancel').textContent = t('cancel');
  document.getElementById('sale-ov-body').innerHTML = `
    <textarea id="sale-paste-ta" style="width:100%;height:160px;padding:12px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:15px;background:var(--bg);color:var(--text);resize:none;outline:none;font-family:inherit;margin-bottom:12px"
      placeholder="${t('saleOvPH')}"></textarea>
    <button class="btn btn-p" onclick="parseSaleText()">${t('readBtn')}</button>`;
  document.getElementById('sale-ov').classList.add('open');
  setTimeout(() => { const ta = document.getElementById('sale-paste-ta'); if (ta) ta.focus(); }, 200);
}

function closeSaleOv() {
  document.getElementById('sale-ov').classList.remove('open');
}

function parseSaleText() {
  const text = (document.getElementById('sale-paste-ta').value || '').trim();
  if (!text) { toast(t('needText')); return; }
  const result = parseItemText(text);
  if (!result.matched.length && !result.unmatched.length) { toast(t('noMatch')); return; }
  window._saleMatched = result.matched;
  document.getElementById('sale-ov-body').innerHTML = buildResultHTML(result, 'sale');
}

function stepSaleResult(id, d) {
  const m = (window._saleMatched || []).find(i => i.product.id === id);
  if (!m) return;
  m.qty = Math.max(0, m.qty + d);
  const el = document.getElementById('srv2-' + id);
  if (el) el.textContent = m.qty;
}

function applySaleResult() {
  const matched = window._saleMatched || [];
  matched.forEach(i => { sVals[i.product.id] = i.qty; });
  window._saleMatched = null;
  closeSaleOv();
  toast(t('toastSalePaste'));
  renderSales();
}

// ════════════════════════════════════════════════════════════
// TEXT PARSING (shared)
// ════════════════════════════════════════════════════════════
function normalize(s) {
  return s.toLowerCase()
    .replace(/[áàảãạăắằẳẵặâấầẩẫậ]/g,'a')
    .replace(/[éèẻẽẹêếềểễệ]/g,'e')
    .replace(/[íìỉĩị]/g,'i')
    .replace(/[óòỏõọôốồổỗộơớờởỡợ]/g,'o')
    .replace(/[úùủũụưứừửữự]/g,'u')
    .replace(/[ýỳỷỹỵ]/g,'y')
    .replace(/đ/g,'d')
    .replace(/[^\w\s\u3000-\u9fff\uac00-\ud7af]/g,'')
    .replace(/\s+/g,' ').trim();
}

function parseItemText(text) {
  const prods = loadProds().filter(p => p.active);
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  // Use a Map to accumulate qty per product (handles duplicate lines)
  const matchedMap = new Map();  // productId → {product, qty, nameOnReceipt}
  const unmatched = [];

  for (const line of lines) {
    const m = line.match(/^(.*?)\s+([\d.]+)\s*$/);
    if (!m) continue;
    const namePart = m[1].trim();
    const qty = Math.round(parseFloat(m[2]));
    if (!qty) continue;

    const normName = normalize(namePart);
    if (!normName) continue;  // skip empty after normalization
    const nameWords = new Set(normName.split(' ').filter(w => w.length >= 2));
    let best = null, bestScore = 0;

    for (const p of prods) {
      const targets = [
        normalize(p.nameVi),
        normalize(p.nameJa),
        normalize(p.nameRo || ''),
      ];
      for (const tgt of targets) {
        if (!tgt) continue;  // skip empty targets
        const tgtWords = new Set(tgt.split(' ').filter(w => w.length >= 2));
        let score = 0;
        if (tgt === normName) score = 100;
        else if (tgt.startsWith(normName) || normName.startsWith(tgt)) score = 80;
        else if (nameWords.size > 0) {
          const overlap = [...nameWords].filter(w => tgtWords.has(w)).length;
          if (overlap > 0) score = Math.round((overlap / nameWords.size) * 70);
        }
        if (score > bestScore) { bestScore = score; best = p; }
      }
    }

    if (best && bestScore >= 60) {
      if (matchedMap.has(best.id)) {
        // Accumulate qty for duplicate product lines
        matchedMap.get(best.id).qty += qty;
      } else {
        matchedMap.set(best.id, { product: best, qty, nameOnReceipt: namePart });
      }
    } else {
      unmatched.push({ nameOnReceipt: namePart, qty });
    }
  }
  return { matched: [...matchedMap.values()], unmatched };
}

function buildResultHTML(result, mode) {
  const stepFn  = mode === 'del' ? 'stepDelResult'  : 'stepSaleResult';
  const applyFn = mode === 'del' ? 'applyDelResult' : 'applySaleResult';
  const rvPrefix = mode === 'del' ? 'drv-' : 'srv2-';
  return `
    <div style="margin-bottom:12px">
      <p style="font-size:13px;font-weight:700;margin-bottom:2px">${t('resultTitle')}</p>
      <p style="font-size:11px;color:var(--sub)">${t('resultSub')}</p>
    </div>
    ${result.matched.map(i => `
      <div class="ri">
        <div style="flex:1"><div class="nm">${pname(i.product)}</div><div class="ns">${i.nameOnReceipt}</div></div>
        <span class="rbadge">✓</span>
        <div class="stepper" style="width:auto">
          <button class="stb" style="width:40px;height:40px;font-size:22px" onclick="${stepFn}('${i.product.id}',-1)">−</button>
          <div class="stv" id="${rvPrefix}${i.product.id}" style="font-size:20px;min-width:44px">${i.qty}</div>
          <button class="stb" style="width:40px;height:40px;font-size:22px" onclick="${stepFn}('${i.product.id}',1)">＋</button>
        </div>
      </div>`).join('')}
    ${result.unmatched.length ? `
      <div style="margin-top:12px;padding:10px;background:var(--warn-bg);border-radius:var(--rsm)">
        <p style="font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px">${t('unmatchTitle')}</p>
        ${result.unmatched.map(i => `<div style="font-size:13px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.06)">${i.nameOnReceipt} × ${i.qty}</div>`).join('')}
      </div>` : ''}
    <div class="mt8"><button class="btn btn-g btn-sm" onclick="${mode === 'del' ? 'openDelOv' : 'openSaleOv'}()">${t('pasteAgain')}</button></div>
    <div class="mt8"><button class="btn btn-p" onclick="${applyFn}()">✓ ${mode === 'del' ? t('btnDelDone') : t('saleApplyBtn')}</button></div>`;
}

// ════════════════════════════════════════════════════════════
// ADMIN
// ════════════════════════════════════════════════════════════
let addFormOpen = false;

function renderAdmin() {
  const prods = loadProds();
  const sm = stocksMap();
  const evts = [...loadEvts()].reverse().slice(0, 40);
  const tl = t('typeLabel');

  document.getElementById('screen-admin').innerHTML = `
    <div class="adm-sec">
      <div class="adm-hdr" onclick="togAddForm()">${t('adminAdd')}</div>
      <div id="add-form" style="display:${addFormOpen ? 'block' : 'none'}" class="adm-body">
        <div class="fg"><label class="fl">${t('lbJa')}</label><input class="fi" id="np-ja" type="text"></div>
        <div class="fg"><label class="fl">${t('lbVi')}</label><input class="fi" id="np-vi" type="text"></div>
        <div class="fg"><label class="fl">${t('lbUnit')}</label><input class="fi" id="np-unit" type="text" placeholder="份 / 袋 / 本 / 個"></div>
        <div class="fg"><label class="fl">${t('lbWarn')}</label><input class="fi" id="np-warn" type="number" min="0" value="2"></div>
        <button class="btn btn-p" onclick="addProd()">${t('btnAdd')}</button>
      </div>
    </div>
    <div class="adm-sec">
      <div class="adm-hdr">${t('adminList')}</div>
      <div class="adm-body" style="padding:0 16px">
        ${prods.map(p => `
          <div class="pr">
            <div style="flex:1"><div class="nm">${pname(p)}</div><div class="ns">${pnamesub(p)}</div><div class="ut">${t('stockLbl')} ${sm[p.id]||0} / ${t('warnLbl')} ${p.warnAt}</div></div>
            <span class="badge ${p.active ? '' : 'off'}">${p.active ? t('active') : t('inactive')}</span>
            <button class="btn btn-g btn-sm" style="width:auto;padding:8px 12px;margin-left:6px" onclick="togProd('${p.id}')">${p.active ? t('btnStop') : t('btnRevive')}</button>
          </div>`).join('')}
      </div>
    </div>
    <div class="adm-sec">
      <div class="adm-hdr">${t('adminHist')}</div>
      <div class="adm-body" style="padding:0 16px">
        ${evts.length ? evts.map(ev => {
          const detail = (ev.items || []).map(i => {
            const p = prods.find(x => x.id === i.productId);
            return `${p ? p.nameJa : i.productId}:${i.qty}`;
          }).join(', ');
          const d = new Date(ev.at);
          const ts = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
          return `<div class="hi"><div style="font-size:11px;color:var(--sub)">${ts}</div><div style="font-weight:600;margin:2px 0">${tl[ev.type] || ev.type}</div><div style="font-size:12px;color:var(--sub)">${detail}</div></div>`;
        }).join('') : `<div class="empty"><p>${t('noHist')}</p></div>`}
      </div>
    </div>
    <div class="adm-sec">
      <div class="adm-hdr">${t('adminBackup')}</div>
      <div class="adm-body">
        <p style="font-size:12px;color:var(--sub);margin-bottom:14px">${t('backupHint')}</p>
        <button class="btn btn-p" onclick="exportData()" style="margin-bottom:10px">${t('btnSave')}</button>
        <label class="btn btn-g" style="cursor:pointer">${t('btnLoad')}<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>
      </div>
    </div>
    <div class="adm-sec">
      <div class="adm-hdr" onclick="togDebug()" style="cursor:pointer">${t('debugTitle')}</div>
      <div id="debug-body" style="display:none;padding:12px 16px"></div>
    </div>
    <div class="mt12" style="margin-bottom:20px">
      <button class="btn btn-g" style="color:var(--danger);border-color:var(--danger)" onclick="resetAll()">${t('btnReset')}</button>
    </div>`;
}

function togAddForm() {
  addFormOpen = !addFormOpen;
  const f = document.getElementById('add-form');
  if (f) f.style.display = addFormOpen ? 'block' : 'none';
}

function addProd() {
  const ja   = document.getElementById('np-ja').value.trim();
  const vi   = document.getElementById('np-vi').value.trim();
  const unit = document.getElementById('np-unit').value.trim() || '份';
  const warn = parseInt(document.getElementById('np-warn').value) || 2;
  if (!ja || !vi) { toast(t('needName')); return; }
  const prods = loadProds();
  prods.push({ id: 'p_' + Date.now(), nameJa: ja, nameVi: vi, nameRo: ja, unit, warnAt: warn, active: true });
  saveProds(prods);
  addEvt('product_add', [], '商品追加: ' + ja);
  toast(t('toastAdded', ja));
  addFormOpen = false;
  renderAdmin();
}

function togProd(id) {
  const prods = loadProds();
  const p = prods.find(x => x.id === id);
  if (!p) return;
  p.active = !p.active;
  saveProds(prods);
  toast(pname(p) + ' → ' + (p.active ? t('active') : t('inactive')));
  renderAdmin();
}

function resetAll() {
  confirm2(t('confReset'), t('confResetBody'), () => {
    localStorage.removeItem('hk_products');
    localStorage.removeItem('hk_events');
    location.reload();
  }, true);
}

function togDebug() {
  const body = document.getElementById('debug-body');
  if (!body) return;
  if (body.style.display === 'block') { body.style.display = 'none'; return; }
  body.style.display = 'block';
  const evts = loadEvts();
  const prods = loadProds();
  const sm = stocksMap();
  const recent = [...evts].reverse().slice(0, 5).map(ev => {
    const detail = (ev.items||[]).map(i => { const p = prods.find(x=>x.id===i.productId); return `${p?p.nameJa:i.productId}:${i.qty}`; }).join(', ');
    return `<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:12px"><span style="color:var(--accent)">[${ev.type}]</span> ${detail}</div>`;
  }).join('');
  const stocks = prods.filter(p=>p.active&&(sm[p.id]||0)>0).map(p=>`<div style="font-size:12px;padding:2px 0">${p.nameJa}: <strong>${sm[p.id]}</strong></div>`).join('');
  body.innerHTML = `
    <p style="font-weight:700;margin-bottom:6px">イベント数: ${evts.length}</p>
    <p style="font-weight:700;margin-bottom:4px">直近5件:</p>${recent||'<div style="color:var(--sub)">なし</div>'}
    <p style="font-weight:700;margin:10px 0 4px">在庫（0以外）:</p>${stocks||'<div style="color:var(--sub)">すべて0</div>'}
    <div class="mt8"><button class="btn btn-g btn-sm" style="width:auto;padding:8px 16px" onclick="copyDebug()">${t('copyDebug')}</button></div>`;
}

function copyDebug() {
  const evts = loadEvts(), prods = loadProds(), sm = stocksMap();
  const text = ['イベント数: ' + evts.length, '直近3件:',
    ...[...evts].reverse().slice(0,3).map(ev=>`  [${ev.type}] `+(ev.items||[]).map(i=>{const p=prods.find(x=>x.id===i.productId);return `${p?p.nameJa:i.productId}:${i.qty}`;}).join(', ')),
    '在庫:', ...prods.filter(p=>p.active).map(p=>`  ${p.nameJa}: ${sm[p.id]||0}`)
  ].join('\n');
  navigator.clipboard.writeText(text).then(()=>toast('コピーしました')).catch(()=>toast('コピー失敗'));
}

// ════════════════════════════════════════════════════════════
// BACKUP / RESTORE
// ════════════════════════════════════════════════════════════
function exportData() {
  const data = { version:1, exportedAt:new Date().toISOString(), products:loadProds(), events:loadEvts() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  a.href = url;
  a.download = `hokkiya-${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(t('toastSaved'));
}

function importData(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.products || !data.events) throw new Error('invalid');
      const ts = data.exportedAt ? new Date(data.exportedAt).toLocaleString('ja-JP') : '不明';
      confirm2('データを読み込みますか？', `保存日時: ${ts}\n現在のデータは上書きされます。`, () => {
        saveProds(data.products);
        saveEvts(data.events);
        toast(t('toastRestored'));
        renderAdmin();
      });
    } catch { toast(t('fileErr')); }
  };
  reader.readAsText(input.files[0]);
  input.value = '';
}

// ════════════════════════════════════════════════════════════
// CONFIRM DIALOG
// ════════════════════════════════════════════════════════════
let confCB = null;

function confirm2(title, body, onOk, danger) {
  document.getElementById('conf-title').textContent = title;
  document.getElementById('conf-body').textContent  = body;
  document.getElementById('conf-ok').textContent     = t('ok');
  document.getElementById('conf-ok').className       = 'btn ' + (danger ? 'btn-d' : 'btn-p');
  document.getElementById('conf-cancel').textContent = t('cancel');
  confCB = onOk;
  document.getElementById('conf').classList.add('open');
}

function doConf() {
  const cb = confCB;   // 退避してからcloseConfでnullにする
  closeConf();
  if (cb) cb();
}

function closeConf() {
  document.getElementById('conf').classList.remove('open');
  confCB = null;
}

// ════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ════════════════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════════════════
boot();
renderStock();
</script>
