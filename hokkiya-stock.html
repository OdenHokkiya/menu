<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>HOKKIYA 在庫 / Tồn Kho</title>
<style>
:root{--bg:#f5f3ef;--surface:#fff;--navy:#1a1a2e;--accent:#c8a96e;--danger:#c0392b;--danger-bg:#fdf0ee;--warn:#e67e22;--warn-bg:#fef9e7;--ok:#27ae60;--text:#1a1a2e;--text-sub:#6b6b8a;--border:#e0ddd6;--nav-h:68px;--r:12px;--r-sm:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:var(--nav-h);font-size:15px;line-height:1.5}
.app-header{background:var(--navy);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.app-header h1{font-size:18px;font-weight:700;letter-spacing:.05em}
.app-header .sub{font-size:11px;color:var(--accent);margin-top:1px}
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--navy);display:flex;z-index:200;border-top:2px solid var(--accent)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(255,255,255,.45);background:none;border:none;cursor:pointer;font-size:10px;padding:4px 2px;transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn .icon{font-size:20px;line-height:1}
.screen{display:none;padding:12px}
.screen.active{display:block}
/* stock */
.stock-list{display:flex;flex-direction:column;gap:8px}
.stock-item{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;border-left:4px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stock-item.danger{border-left-color:var(--danger);background:var(--danger-bg)}
.stock-item.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.stock-item .names{flex:1}
.name-vi{font-size:15px;font-weight:600}
.name-ja{font-size:12px;color:var(--text-sub);margin-top:1px}
.unit-tag{font-size:11px;color:var(--text-sub)}
.stock-qty{font-size:30px;font-weight:800;min-width:44px;text-align:right;color:var(--navy)}
.stock-item.danger .stock-qty{color:var(--danger)}
.stock-item.warn .stock-qty{color:var(--warn)}
/* stock+report integrated */
.stock-item.sr-checked{border-left-color:var(--navy)!important;background:#f0f7ff!important}
.stock-item.sr-checked .stock-qty{color:var(--navy)}
.report-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.report-hdr.checked{background:#f0f7ff}
.chk{width:26px;height:26px;border-radius:6px;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff;transition:all .15s}
.chk.on{background:var(--navy);border-color:var(--navy)}
.report-body{padding:0 16px 16px;border-top:1px solid var(--border);display:none}
.report-body.open{display:block}
/* stepper */
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:var(--r-sm);overflow:hidden;border:1.5px solid var(--border)}
.step-btn{width:54px;height:54px;background:none;border:none;font-size:28px;font-weight:300;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-btn:active{background:var(--border)}
.step-val{flex:1;text-align:center;font-size:28px;font-weight:800;color:var(--navy);min-width:60px}
/* btn */
.btn{display:block;width:100%;padding:16px;border-radius:var(--r);border:none;font-size:16px;font-weight:700;cursor:pointer;text-align:center;transition:opacity .15s,transform .1s}
.btn:active{opacity:.85;transform:scale(.98)}
.btn-primary{background:var(--navy);color:#fff}
.btn-accent{background:var(--accent);color:var(--navy)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--navy);border:2px solid var(--border)}
.btn .vi{font-size:13px;font-weight:500;display:block;opacity:.8;margin-top:2px}
.btn-sm{padding:10px 16px;font-size:14px}
/* screenshot */
#ss-view{display:none;position:fixed;inset:0;background:#fff;z-index:500;padding:32px 24px;overflow-y:auto}
#ss-view.open{display:block}
.ss-hdr{text-align:center;margin-bottom:24px}
.ss-logo{font-size:28px;font-weight:900;letter-spacing:.12em}
.ss-sub{font-size:14px;color:#555;margin-top:4px}
.ss-date{font-size:13px;color:#888;margin-top:2px}
.ss-table{width:100%;border-collapse:collapse;margin:20px 0}
.ss-table tr{border-bottom:1px solid #eee}
.ss-table td{padding:12px 4px}
.item-qty{font-size:24px;font-weight:900;text-align:right;min-width:48px}
.ss-close{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border:none;border-radius:40px;padding:14px 36px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)}
/* delivery / sale */
.d-item{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.d-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.s-item{background:var(--surface);border-radius:var(--r);margin-bottom:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
/* admin */
.adm-sec{background:var(--surface);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.adm-hdr{padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border);cursor:pointer}
.adm-body{padding:16px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:5px;display:block}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;background:var(--bg);color:var(--text);outline:none}
.form-input:focus{border-color:var(--accent)}
.hist-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.hist-item:last-child{border-bottom:none}
.hist-time{color:var(--text-sub);font-size:11px}
.hist-desc{font-weight:600;margin:2px 0}
.hist-detail{color:var(--text-sub);font-size:12px}
.prod-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.prod-row:last-child{border-bottom:none}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:#eafaf1;color:var(--ok)}
.badge.off{background:#f5f5f5;color:#999}
/* init */
#init-ov{position:fixed;inset:0;background:var(--bg);z-index:600;overflow-y:auto;display:none}
#init-ov.open{display:block}
.init-hdr{background:var(--navy);color:#fff;padding:20px 16px;text-align:center}
.init-hdr h2{font-size:20px}
.init-hdr p{font-size:13px;color:var(--accent);margin-top:4px}
/* confirm */
#conf{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:700;align-items:flex-end;justify-content:center}
#conf.open{display:flex}
.conf-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 16px 36px;width:100%;max-width:480px}
.conf-title{font-size:17px;font-weight:700;margin-bottom:6px}
.conf-body{font-size:14px;color:var(--text-sub);margin-bottom:20px;white-space:pre-wrap}
.conf-acts{display:flex;gap:10px}
.conf-acts .btn{flex:1}
/* search */
.srch-wrap{position:relative}
.srch-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-sub);font-size:16px;pointer-events:none}
.srch-box{width:100%;padding:12px 14px 12px 38px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;background:var(--surface);color:var(--text);outline:none;margin-bottom:12px}
/* toast */
#toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:40px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1}
/* ocr overlay */
#ocr-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;align-items:flex-end;justify-content:center}
#ocr-ov.open{display:flex}
.ocr-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.ocr-title{font-size:17px;font-weight:700;margin-bottom:4px}
.ocr-sub{font-size:12px;color:var(--text-sub);margin-bottom:16px}
.upload-area{border:2px dashed var(--border);border-radius:var(--r);padding:32px 16px;text-align:center;cursor:pointer;background:var(--bg);transition:border-color .2s}
.upload-area:active{border-color:var(--accent)}
.upload-area .icon{font-size:36px;margin-bottom:8px}
.upload-area p{font-size:14px;color:var(--text-sub)}
.ocr-reading{text-align:center;padding:32px 0}
.ocr-spinner{font-size:32px;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-result-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ocr-result-item:last-child{border-bottom:none}
.ocr-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.ocr-badge.matched{background:#eafaf1;color:var(--ok)}
.ocr-badge.unmatched{background:#fef9e7;color:var(--warn)}
.empty{text-align:center;padding:40px 20px;color:var(--text-sub)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
</style>
</head>
<body>
<header class="app-header">
  <div style="flex:1">
    <h1>🧊 HOKKIYA</h1>
    <div class="sub" id="hdr-sub">在庫管理 / Quản lý tồn kho</div>
  </div>
  <button id="lang-btn" onclick="toggleLang()" style="background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0">🇻🇳 VI</button>
</header>

<div id="screen-stock"    class="screen active"></div>
<div id="screen-delivery" class="screen"></div>
<div id="screen-sales"    class="screen"></div>
<div id="screen-admin"    class="screen"></div>

<nav class="nav">
  <button class="nav-btn active" onclick="go('stock')"    data-s="stock">
    <span class="icon">🧊</span><span style="font-size:10px">Tồn kho</span><span style="font-size:9px;opacity:.8">在庫・報告</span>
  </button>
  <button class="nav-btn" onclick="go('delivery')" data-s="delivery">
    <span class="icon">📦</span><span style="font-size:10px">Nhận hàng</span><span style="font-size:9px;opacity:.8">納品</span>
  </button>
  <button class="nav-btn" onclick="go('sales')"    data-s="sales">
    <span class="icon">🧾</span><span style="font-size:10px">Bán hàng</span><span style="font-size:9px;opacity:.8">販売</span>
  </button>
  <button class="nav-btn" onclick="go('admin')"    data-s="admin">
    <span class="icon">⚙️</span><span style="font-size:10px">Quản lý</span><span style="font-size:9px;opacity:.8">管理</span>
  </button>
</nav>

<!-- Screenshot -->
<div id="ss-view">
  <div class="ss-hdr">
    <div class="ss-logo">HOKKIYA</div>
    <div class="ss-sub" id="ss-title">BÁO SỐ LƯỢNG CÒN LẠI</div>
    <div class="ss-date" id="ss-date"></div>
    <div id="ss-order-msg" style="margin-top:10px;font-size:15px;font-weight:700;color:#333"></div>
  </div>
  <table class="ss-table" id="ss-table"></table>
  <div style="height:80px"></div>
  <button id="ss-close-btn" class="ss-close" onclick="document.getElementById('ss-view').classList.remove('open')">✕ Đóng</button>
</div>

<!-- Init -->
<div id="init-ov">
  <div class="init-hdr">
    <h2 id="init-title-txt"></h2>
  </div>
  <div style="padding:16px">
    <p style="font-size:13px;color:var(--text-sub);margin-bottom:16px" id="init-hint-txt"></p>
    <div id="init-list"></div>
    <div class="mt16"><button class="btn btn-primary" id="init-done-btn" onclick="completeInit()"></button></div>
  </div>
</div>

<!-- Sales paste overlay -->
<div id="sales-paste-ov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;align-items:flex-end;justify-content:center" class="sales-ov-wrap">
  <div class="ocr-sheet">
    <div class="ocr-title" id="sale-paste-title-txt"></div>
    <div class="ocr-sub" id="sale-paste-sub-txt"></div>
    <div id="sales-paste-body"></div>
    <div class="mt8">
      <button class="btn btn-ghost" onclick="closeSalesPaste()">キャンセル / Hủy</button>
    </div>
  </div>
</div>

<!-- Text paste overlay -->
<div id="ocr-ov">
  <div class="ocr-sheet">
    <div class="ocr-title" id="ocr-title-txt"></div>
    <div class="ocr-sub" id="ocr-sub-txt"></div>
    <div id="ocr-body">
      <textarea id="paste-input" 
        style="width:100%;height:160px;padding:12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;background:var(--bg);color:var(--text);resize:none;outline:none;font-family:inherit;margin-bottom:12px"
        placeholder="${t('delPastePH')}"></textarea>
      <button class="btn btn-primary" onclick="parsePastedText()">
        読み取る / Đọc nội dung
      </button>
    </div>
    <div class="mt8">
      <button class="btn btn-ghost" onclick="closeOcr()">キャンセル / Hủy</button>
    </div>
  </div>
</div>

<!-- Confirm -->
<div id="conf">
  <div class="conf-sheet">
    <div class="conf-title" id="conf-title"></div>
    <div class="conf-body"  id="conf-body"></div>
    <div class="conf-acts">
      <button class="btn btn-ghost" onclick="closeConf()">キャンセル</button>
      <button class="btn btn-primary" id="conf-ok">確認</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── STORAGE ─────────────────────────────────────────────────────────
const LS={
  get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))
};
const loadProds=()=>LS.get('hk_products')||[];
const saveProds=p=>LS.set('hk_products',p);
const loadEvts =()=>LS.get('hk_events')||[];
const saveEvts =e=>LS.set('hk_events',e);

function addEvt(type,items,note=''){
  const e=loadEvts();
  e.push({id:Date.now().toString(),type,at:new Date().toISOString(),items,note});
  saveEvts(e);
}

function calcStock(pid){
  let qty=0;
  for(const ev of loadEvts()){
    const it=ev.items.find(i=>i.productId===pid);
    if(!it) continue;
    if(ev.type==='init'||ev.type==='adjust') qty=it.qty;
    if(ev.type==='delivery') qty+=it.qty;
    if(ev.type==='sale')     qty-=it.qty;
  }
  return Math.max(0,qty);
}

function stocksMap(){
  const m={};
  for(const p of loadProds()) m[p.id]=calcStock(p.id);
  return m;
}

// ─── LANGUAGE ────────────────────────────────────────────────────────

    // toast

    toastRestored: '📂 Đã khôi phục dữ liệu ✓',

function t(key, ...args) {
  const val = T[lang][key];
  return typeof val === 'function' ? val(...args) : (val ?? key);
}

function pname(p) {
  return lang === 'vi' ? p.nameVi : p.nameJa;
}
function pnamesub(p) {
  return lang === 'vi' ? p.nameJa : p.nameVi;
}

function toggleLang() {
  lang = lang === 'vi' ? 'ja' : 'vi';
  LS.set('hk_lang', lang);
  applyLang();
  // Re-render current screen
  const active = document.querySelector('.nav-btn.active');
  if (active) render(active.dataset.s);
}

function applyLang() {
  document.getElementById('hdr-sub').textContent = t('hdrSub');
  document.getElementById('lang-btn').textContent = t('langBtn');
  // Nav labels
  const navData = [
    ['stock',    'navStock',  'navStockSub'],
    ['delivery', 'navDel',    'navDelSub'],
    ['sales',    'navSale',   'navSaleSub'],
    ['admin',    'navAdmin',  'navAdminSub'],
  ];
  navData.forEach(([s, main, sub]) => {
    const btn = document.querySelector(`.nav-btn[data-s="${s}"]`);
    if (!btn) return;
    const spans = btn.querySelectorAll('span:not(.icon)');
    if (spans[0]) spans[0].textContent = t(main);
    if (spans[1]) spans[1].textContent = t(sub);
  });
}

// ─── INIT ─────────────────────────────────────────────────────────────
function boot(){
  if(!loadProds().length){ saveProds(DEFAULT_PRODUCTS.map(p=>({...p}))); }
  if(!loadEvts().some(e=>e.type==='init')) showInit();
}

function showInit(){
  document.getElementById('init-title-txt').textContent=t('initTitle');
  document.getElementById('init-hint-txt').textContent=t('initHint');
  document.getElementById('init-done-btn').textContent=t('btnInitDone');
  const prods=loadProds().filter(p=>p.active);
  document.getElementById('init-list').innerHTML=prods.map(p=>`
    <div class="s-item" style="margin-bottom:10px">
      <div class="names" style="flex:1"><div class="name-vi">${p.nameVi}</div><div class="name-ja">${p.nameJa}</div></div>
      <div class="stepper">
        <button class="step-btn" onclick="stepI('${p.id}',-1)">−</button>
        <div class="step-val" id="iv-${p.id}">0</div>
        <button class="step-btn" onclick="stepI('${p.id}',1)">＋</button>
      </div>
    </div>`).join('');
  document.getElementById('init-ov').classList.add('open');
}

const iVals={};
function stepI(id,d){
  iVals[id]=Math.max(0,(iVals[id]||0)+d);
  const el=document.getElementById('iv-'+id);
  if(el) el.textContent=iVals[id];
}
function completeInit(){
  const items=loadProds().filter(p=>p.active).map(p=>({productId:p.id,qty:iVals[p.id]||0}));
  addEvt('init',items,'初回在庫登録');
  document.getElementById('init-ov').classList.remove('open');
  render('stock');
  toast('在庫を登録しました ✓');
}

// ─── NAV ──────────────────────────────────────────────────────────────
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelector(`.nav-btn[data-s="${name}"]`).classList.add('active');
  render(name);
}
function render(name){
  if(name==='stock')    renderStock();
  if(name==='delivery') renderDelivery();
  if(name==='sales')    renderSales();
  if(name==='admin')    renderAdmin();
}

const rVals={}, rChk={};

function renderStock(){
  const prods=loadProds().filter(p=>p.active);
  const sm=stocksMap();
  const sorted=[...prods].sort((a,b)=>(sm[a.id]||0)-(sm[b.id]||0));

  document.getElementById('screen-stock').innerHTML=`
    <div class="srch-wrap" style="margin-bottom:8px">
      <span class="srch-icon">🔍</span>
      <input class="srch-box" type="text" placeholder="${t('searchPlaceholder')}" oninput="filterStock(this.value)" style="margin-bottom:0">
    </div>
    <p style="font-size:11px;color:var(--text-sub);margin-bottom:10px">${t('stockHint')}</p>
    <div class="stock-list" id="sl">
      ${sorted.map(p=>stockReportItemHTML(p, sm[p.id]||0)).join('')}
    </div>
    <div id="ss-btns" style="display:none;position:sticky;bottom:calc(var(--nav-h) + 8px);padding:10px 0;background:var(--bg)">
      <button class="btn btn-accent" onclick="genSS()">${t('btnSS')}</button>
      <div class="mt8"><button class="btn btn-primary" onclick="submitReport()">${t('btnUpdate')}</button></div>
    </div>`;
}

function stockReportItemHTML(p, qty){
  const cls = qty===0?'danger': qty<=p.warnAt?'warn':'';
  const on = !!rChk[p.id];
  if(!(p.id in rVals)) rVals[p.id]=qty;
  return `
    <div class="stock-item ${cls} ${on?'sr-checked':''}" id="sri-${p.id}" data-n="${p.nameJa} ${p.nameVi}" style="cursor:pointer;flex-direction:column;align-items:stretch;padding:0;gap:0">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px" onclick="togSR('${p.id}',${qty})">
        <div class="chk ${on?'on':''}" id="srcb-${p.id}">✓</div>
        <div class="names" style="flex:1">
          <div class="name-vi" style="font-size:15px;font-weight:600">${pname(p)}</div>
          <div class="name-ja" style="font-size:12px;color:var(--text-sub)">${pnamesub(p)}</div>
        </div>
        <div class="stock-qty" style="font-size:26px">${qty}</div>
      </div>
      <div id="srb-${p.id}" style="display:${on?'block':'none'};padding:0 16px 14px;border-top:1px solid var(--border)">
        <p style="font-size:11px;color:var(--text-sub);margin:8px 0 6px">${t('actualQty')}</p>
        <div class="stepper">
          <button class="step-btn" onclick="stepSR('${p.id}',-1)">−</button>
          <div class="step-val" id="srv-${p.id}">${rVals[p.id]}</div>
          <button class="step-btn" onclick="stepSR('${p.id}',1)">＋</button>
        </div>
      </div>
    </div>`;
}

function togSR(id, estQty){
  rChk[id]=!rChk[id];
  if(!(id in rVals)) rVals[id]=estQty;
  const cb=document.getElementById('srcb-'+id);
  const body=document.getElementById('srb-'+id);
  const item=document.getElementById('sri-'+id);
  if(cb) cb.classList.toggle('on', rChk[id]);
  if(body) body.style.display=rChk[id]?'block':'none';
  if(item) item.classList.toggle('sr-checked', rChk[id]);
  // Show/hide bottom buttons
  const anyChecked=Object.values(rChk).some(v=>v);
  const btns=document.getElementById('ss-btns');
  if(btns) btns.style.display=anyChecked?'block':'none';
}

function stepSR(id,d){
  rVals[id]=Math.max(0,(rVals[id]||0)+d);
  const el=document.getElementById('srv-'+id);
  if(el) el.textContent=rVals[id];
}

function filterStock(q){
  document.querySelectorAll('#sl .stock-item').forEach(el=>{
    el.style.display=el.dataset.n.toLowerCase().includes(q.toLowerCase())?'':'none';
  });
}

function genSS(){
  const ids=Object.keys(rChk).filter(id=>rChk[id]);
  if(!ids.length){toast(t('selectItem'));return;}
  const prods=loadProds();
  const now=new Date();
  const daysVi=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  const daysJa=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
  const dayStr = lang==='vi' ? daysVi[now.getDay()] : daysJa[now.getDay()];
  const dd=now.getDate().toString().padStart(2,'0');
  const mm=(now.getMonth()+1).toString().padStart(2,'0');
  const yyyy=now.getFullYear();
  document.getElementById('ss-date').textContent=`${dayStr}, ${dd}/${mm}/${yyyy}`;
  document.getElementById('ss-order-msg').textContent=t('ssMsg');
  document.getElementById('ss-title').textContent=t('ssTitle');
  document.getElementById('ss-close-btn').textContent=t('ssClose');
  document.getElementById('ss-table').innerHTML=ids.map(id=>{
    const p=prods.find(x=>x.id===id);
    if(!p) return '';
    return `<tr>
      <td><div style="font-size:15px;font-weight:600">${pname(p)}</div><div style="font-size:11px;color:#999">${pnamesub(p)}</div></td>
      <td class="item-qty">${rVals[id]??0}</td>
    </tr>`;
  }).join('');
  document.getElementById('ss-view').classList.add('open');
}

function submitReport(){
  const ids=Object.keys(rChk).filter(id=>rChk[id]);
  if(!ids.length){toast(t('selectItem'));return;}
  confirm2(t('confirmUpdate'), t('confirmUpdateBody', ids.length), ()=>{
    addEvt('adjust',ids.map(id=>({productId:id,qty:rVals[id]||0})),'残数報告による修正');
    ids.forEach(id=>{ delete rChk[id]; delete rVals[id]; });
    toast(t('toastUpdated'));
    renderStock();
  });
}

const dVals={}, dChk={};
function renderDelivery(){
  const prods=loadProds().filter(p=>p.active);
  const evts=loadEvts();
  const lastAdj=[...evts].reverse().find(e=>e.type==='adjust');
  let items=lastAdj
    ? lastAdj.items.map(i=>prods.find(p=>p.id===i.productId)).filter(Boolean)
    : prods;
  items.forEach(p=>{ if(!(p.id in dVals)) dVals[p.id]=0; });

  document.getElementById('screen-delivery').innerHTML=`
    <div class="mt8" style="margin-bottom:14px">
      <button class="btn btn-accent" onclick="openOcr()">${t('delPasteBtn')}</button>
    </div>
    <p style="font-size:12px;color:var(--text-sub);margin-bottom:4px">${t('delHint')}</p>
    ${lastAdj?`<p style="font-size:11px;color:var(--text-sub);margin-bottom:12px">${t('delFrom')}</p>`:''}
    <div id="dl">${items.map(p=>delItemHTML(p)).join('')}</div>
    <div id="d-add" class="mt8">
      <button class="btn btn-ghost btn-sm" onclick="showAllDel()">${t('delAddMore')}</button>
    </div>
    <div class="mt12">
      <button class="btn btn-primary" onclick="submitDel()">${t('btnDelDone')}</button>
    </div>`;
}
function delItemHTML(p){
  const on=!!dChk[p.id];
  return `<div class="d-item" id="di-${p.id}">
    <div class="d-row">
      <div class="chk ${on?'on':''}" id="dcb-${p.id}" onclick="togD('${p.id}')" style="cursor:pointer">✓</div>
      <div class="names" style="flex:1"><div style="font-size:15px;font-weight:600">${pname(p)}</div><div style="font-size:12px;color:var(--text-sub)">${pnamesub(p)}</div></div>
      <div class="stepper" style="width:auto">
        <button class="step-btn" style="width:46px;height:46px" onclick="stepD('${p.id}',-1)">−</button>
        <div class="step-val" id="dv-${p.id}" style="font-size:22px;min-width:46px">${dVals[p.id]||0}</div>
        <button class="step-btn" style="width:46px;height:46px" onclick="stepD('${p.id}',1)">＋</button>
      </div>
    </div>
  </div>`;
}
function togD(id){
  dChk[id]=!dChk[id];
  const cb=document.getElementById('dcb-'+id);
  if(cb) cb.classList.toggle('on',dChk[id]);
}
function stepD(id,d){
  dVals[id]=Math.max(0,(dVals[id]||0)+d);
  const el=document.getElementById('dv-'+id);
  if(el) el.textContent=dVals[id];
  if(dVals[id]>0&&!dChk[id]){dChk[id]=true;const cb=document.getElementById('dcb-'+id);if(cb)cb.classList.add('on');}
}
function showAllDel(){
  const prods=loadProds().filter(p=>p.active);
  const dl=document.getElementById('dl');
  prods.forEach(p=>{
    if(!document.getElementById('di-'+p.id)){
      dVals[p.id]=dVals[p.id]||0;
      dl.insertAdjacentHTML('beforeend',delItemHTML(p));
    }
  });
  document.getElementById('d-add').style.display='none';
}
function submitDel(){
  const ids=Object.keys(dChk).filter(id=>dChk[id]&&dVals[id]>0);
  if(!ids.length){toast(t('enterQty'));return;}
  confirm2(t('confirmDel'), t('confirmDelBody', ids.length), ()=>{
    addEvt('delivery',ids.map(id=>({productId:id,qty:dVals[id]})),'納品確認');
    ids.forEach(id=>{delete dChk[id];dVals[id]=0;});
    toast(t('toastDelivered'));
    closeOcr();
    go('stock');
  });
}

// ─── SALES ────────────────────────────────────────────────────────────
const sVals={};
function renderSales(){
  const prods=loadProds().filter(p=>p.active);
  const sm=stocksMap();
  const sorted=[...prods].sort((a,b)=>a.nameJa.localeCompare(b.nameJa,'ja'));
  document.getElementById('screen-sales').innerHTML=`
    <div class="mt8" style="margin-bottom:14px">
      <button class="btn btn-accent" onclick="openSalesPaste()">${t('salePasteBtn')}</button>
    </div>
    <p style="font-size:12px;color:var(--text-sub);margin-bottom:12px">${t('saleManual')}</p>
    <div>${sorted.map(p=>{
      if(!(p.id in sVals)) sVals[p.id]=0;
      return `<div class="s-item">
        <div class="names" style="flex:1"><div style="font-size:15px;font-weight:600">${pname(p)}</div><div style="font-size:12px;color:var(--text-sub)">${pnamesub(p)}</div><div class="unit-tag">${t('stockLabel')} ${sm[p.id]||0} ${p.unit}</div></div>
        <div class="stepper">
          <button class="step-btn" onclick="stepS('${p.id}',-1)">−</button>
          <div class="step-val" id="sv-${p.id}">${sVals[p.id]}</div>
          <button class="step-btn" onclick="stepS('${p.id}',1)">＋</button>
        </div>
      </div>`;
    }).join('')}</div>
    <div class="mt12">
      <button class="btn btn-primary" onclick="submitSales()">${t('btnSaleDone')}</button>
    </div>`;
}
function stepS(id,d){
  sVals[id]=Math.max(0,(sVals[id]||0)+d);
  const el=document.getElementById('sv-'+id);
  if(el) el.textContent=sVals[id];
}
function submitSales(){
  const items=Object.entries(sVals).filter(([,q])=>q>0).map(([pid,qty])=>({productId:pid,qty}));
  if(!items.length){toast(t('enterQty'));return;}
  confirm2(t('confirmSale'), t('confirmSaleBody', items.length), ()=>{
    addEvt('sale',items,'販売確定');
    items.forEach(i=>{sVals[i.productId]=0;});
    toast(t('toastSold'));

}

// ─── SALES TEXT PASTE ────────────────────────────────────────────────
function openSalesPaste(){
  const ov=document.getElementById('sales-paste-ov');
  ov.style.display='flex';
  const tt=document.getElementById('sale-paste-title-txt');
  const st=document.getElementById('sale-paste-sub-txt');
  if(tt) tt.textContent=t('salePasteTitle');
  if(st) st.textContent=t('salePasteSub');
  document.getElementById('sales-paste-body').innerHTML=`
    <textarea id="sales-paste-input"
      style="width:100%;height:160px;padding:12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;background:var(--bg);color:var(--text);resize:none;outline:none;font-family:inherit;margin-bottom:12px"
      placeholder="${t('salePastePH')}"></textarea>
    <button class="btn btn-primary" onclick="parseSalesText()">
      読み取る / Đọc nội dung
    </button>`;
  setTimeout(()=>{
    const ta=document.getElementById('sales-paste-input');
    if(ta) ta.focus();
  },200);
}
function closeSalesPaste(){
  document.getElementById('sales-paste-ov').style.display='none';
}

function parseSalesText(){
  const text=(document.getElementById('sales-paste-input').value||'').trim();
  if(!text){toast(t('enterText'));return;}

  const prods=loadProds().filter(p=>p.active);
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const matched=[];
  const unmatched=[];

  const normalize=s=>s.toLowerCase()
    .replace(/[áàảãạăắằẳẵặâấầẩẫậ]/g,'a')
    .replace(/[éèẻẽẹêếềểễệ]/g,'e')
    .replace(/[íìỉĩị]/g,'i')
    .replace(/[óòỏõọôốồổỗộơớờởỡợ]/g,'o')
    .replace(/[úùủũụưứừửữự]/g,'u')
    .replace(/[ýỳỷỹỵ]/g,'y')
    .replace(/đ/g,'d')
    .replace(/[^\w\s]/g,'')
    .replace(/\s+/g,' ').trim();

  for(const line of lines){
    // 末尾の数字を数量として取得（小数点対応：13.00→13）
    const m=line.match(/^(.*?)\s+([\d.]+)\s*$/);
    if(!m) continue;
    const namePart=m[1].trim();
    const qty=Math.round(parseFloat(m[2]));
    if(!qty) continue;

    const normName=normalize(namePart);
    let best=null, bestScore=0;

    for(const p of prods){
      const targets=[p.nameVi, p.nameJa].map(normalize);
      for(const t of targets){
        let score=0;
        if(t===normName) score=100;
        else if(t.includes(normName)||normName.includes(t)) score=50;
        else {
          const wa=new Set(normName.split(' '));
          const wb=new Set(t.split(' '));
          const overlap=[...wa].filter(w=>w.length>2&&wb.has(w)).length;
          if(overlap>0) score=overlap*20;
        }
        if(score>bestScore){bestScore=score;best=p;}
      }
    }

    if(best&&bestScore>=20){
      matched.push({product:best, qty, nameOnReceipt:namePart});
    } else {
      unmatched.push({nameOnReceipt:namePart, qty});
    }
  }

  if(!matched.length&&!unmatched.length){
    toast(t('noMatch'));return;
  }

  // Pre-fill sVals
  matched.forEach(i=>{ sVals[i.product.id]=i.qty; });

  document.getElementById('sales-paste-body').innerHTML=`
    <div style="margin-bottom:12px">
      <p style="font-size:13px;font-weight:700;margin-bottom:2px">${t('resultTitle')}</p>
      <p style="font-size:11px;color:var(--text-sub)">${t('resultSub')}</p>
    </div>
    ${matched.map(i=>`
      <div class="ocr-result-item">
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">${pname(i.product)}</div>
          <div style="font-size:11px;color:var(--text-sub)">${i.nameOnReceipt}</div>
        </div>
        <span class="ocr-badge matched">✓</span>
        <div class="stepper" style="width:auto">
          <button class="step-btn" style="width:40px;height:40px;font-size:22px" onclick="stepSalePaste('${i.product.id}',-1)">−</button>
          <div class="step-val" id="spv-${i.product.id}" style="font-size:20px;min-width:44px">${i.qty}</div>
          <button class="step-btn" style="width:40px;height:40px;font-size:22px" onclick="stepSalePaste('${i.product.id}',1)">＋</button>
        </div>
      </div>`).join('')}
    ${unmatched.length?`
      <div style="margin-top:12px;padding:10px;background:var(--warn-bg);border-radius:var(--r-sm)">
        <p style="font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px">${t('unmatchedTitle')}</p>
        ${unmatched.map(i=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.06)">${i.nameOnReceipt} × ${i.qty}</div>`).join('')}
      </div>`:''}
    <div class="mt8">
      <button class="btn btn-ghost btn-sm" onclick="openSalesPaste()">${t('pasteAgain')}</button>
    </div>
    <div class="mt8">
<button class="btn btn-primary" onclick="applySalesPaste()">${t('applySale')}</button>
    </div>`;
}

function stepSalePaste(id,d){
  sVals[id]=Math.max(0,(sVals[id]||0)+d);
  const el=document.getElementById('spv-'+id);
  if(el) el.textContent=sVals[id];
}

function applySalesPaste(){
  closeSalesPaste();
  renderSales();
  toast(t('toastSalePaste'));
}

// ─── TEXT PASTE DELIVERY ─────────────────────────────────────────────
function openOcr(){
  // Reset textarea
  document.getElementById('ocr-body').innerHTML=`
    <textarea id="paste-input"
      style="width:100%;height:160px;padding:12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;background:var(--bg);color:var(--text);resize:none;outline:none;font-family:inherit;margin-bottom:12px"
      placeholder="${t('delPastePH')}"></textarea>
    <button class="btn btn-primary" onclick="parsePastedText()">
      読み取る / Đọc nội dung
    </button>`;
  document.getElementById('ocr-ov').classList.add('open');
  // Auto-focus textarea after short delay
  setTimeout(()=>{
    const ta=document.getElementById('paste-input');
    if(ta) ta.focus();
  },200);
}

function closeOcr(){
  document.getElementById('ocr-ov').classList.remove('open');
}

function parsePastedText(){
  const text=(document.getElementById('paste-input').value||'').trim();
  if(!text){toast(t('enterText'));return;}

  const prods=loadProds().filter(p=>p.active);
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const matched=[];
  const unmatched=[];

  for(const line of lines){
    // Extract trailing number (quantity)
    const m=line.match(/^(.*?)\s+(\d+)\s*$/);
    if(!m) continue;
    const namePart=m[1].trim();
    const qty=parseInt(m[2]);

    // Try to match against product master
    // Score: exact match > contains > fuzzy (normalized)
    const normalize=s=>s.toLowerCase()
      .replace(/[áàảãạăắằẳẵặâấầẩẫậ]/g,'a')
      .replace(/[éèẻẽẹêếềểễệ]/g,'e')
      .replace(/[íìỉĩị]/g,'i')
      .replace(/[óòỏõọôốồổỗộơớờởỡợ]/g,'o')
      .replace(/[úùủũụưứừửữự]/g,'u')
      .replace(/[ýỳỷỹỵ]/g,'y')
      .replace(/đ/g,'d')
      .replace(/[^\w\s]/g,'')
      .replace(/\s+/g,' ').trim();

    const normName=normalize(namePart);
    let best=null, bestScore=0;

    for(const p of prods){
      const targets=[p.nameVi, p.nameJa].map(normalize);
      for(const t of targets){
        let score=0;
        if(t===normName) score=100;
        else if(t.includes(normName)||normName.includes(t)) score=50;
        else {
          // word overlap
          const wa=new Set(normName.split(' '));
          const wb=new Set(t.split(' '));
          const overlap=[...wa].filter(w=>w.length>2&&wb.has(w)).length;
          if(overlap>0) score=overlap*20;
        }
        if(score>bestScore){bestScore=score;best=p;}
      }
    }

    if(best&&bestScore>=20){
      matched.push({product:best, qty, nameOnReceipt:namePart});
    } else {
      unmatched.push({nameOnReceipt:namePart, qty});
    }
  }

  if(!matched.length&&!unmatched.length){
    toast('商品が見つかりませんでした。フォーマットを確認してください。');
    return;
  }

  showParseResult(matched, unmatched);
}

function showParseResult(matched, unmatched){
  // Store matched items for direct submission
  const ocrItems = {};
  matched.forEach(i=>{ ocrItems[i.product.id]=i.qty; });

  document.getElementById('ocr-body').innerHTML=`
    <div style="margin-bottom:12px">
      <p style="font-size:13px;font-weight:700;margin-bottom:2px">${t('resultTitle')}</p>
      <p style="font-size:11px;color:var(--text-sub)">${t('resultSub')}</p>
    </div>
    ${matched.map(i=>`
      <div class="ocr-result-item">
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600">${pname(i.product)}</div>
          <div style="font-size:11px;color:var(--text-sub)">${i.nameOnReceipt}</div>
        </div>
        <span class="ocr-badge matched">✓</span>
        <div class="stepper" style="width:auto">
          <button class="step-btn" style="width:40px;height:40px;font-size:22px" onclick="stepOcrItem('${i.product.id}',-1)">−</button>
          <div class="step-val" id="ocrv-${i.product.id}" style="font-size:20px;min-width:44px">${i.qty}</div>
          <button class="step-btn" style="width:40px;height:40px;font-size:22px" onclick="stepOcrItem('${i.product.id}',1)">＋</button>
        </div>
      </div>`).join('')}
    ${unmatched.length?`
      <div style="margin-top:12px;padding:10px;background:var(--warn-bg);border-radius:var(--r-sm)">
        <p style="font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px">${t('unmatchedTitle')}</p>
        ${unmatched.map(i=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.06)">${i.nameOnReceipt} × ${i.qty}</div>`).join('')}
      </div>`:''}
    <div class="mt8">
      <button class="btn btn-ghost btn-sm" onclick="openOcr()">${t('pasteAgain')}</button>
    </div>
    <div class="mt8">
      <button class="btn btn-primary" onclick="confirmOcrDelivery()">
        ✓ ${lang==='vi'?'Xác nhận nhận hàng & cộng vào tồn kho':'受取完了・在庫へ加算'}
      </button>
    </div>`;

  // Save to module-level for confirmOcrDelivery
  window._ocrMatchedItems = matched;
}

function stepOcrItem(id,d){
  // Update both display and internal tracking
  const el=document.getElementById('ocrv-'+id);
  if(!el) return;
  const newVal=Math.max(0,parseInt(el.textContent||0)+d);
  el.textContent=newVal;
  // Update matched items array
  if(window._ocrMatchedItems){
    const item=window._ocrMatchedItems.find(i=>i.product.id===id);
    if(item) item.qty=newVal;
  }
}

function confirmOcrDelivery(){
  const items=(window._ocrMatchedItems||[]).filter(i=>i.qty>0).map(i=>({productId:i.product.id, qty:i.qty}));
  if(!items.length){toast(t('enterQty'));return;}
  addEvt('delivery', items, '伝票テキストによる納品');
  window._ocrMatchedItems=null;
  closeOcr();
  toast(t('toastDelivered'));
  renderStock();
  go('stock');
}

// ─── BACKUP / RESTORE ────────────────────────────────────────────────
function exportData(){
  const data={
    version: 1,
    exportedAt: new Date().toISOString(),
    products: loadProds(),
    events: loadEvts(),
  };
  const json=JSON.stringify(data, null, 2);
  const blob=new Blob([json], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const now=new Date();
  const stamp=`${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}`;
  a.href=url;
  a.download=`hokkiya-stock-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(t('toastSaved'));
}

function importData(input){
  if(!input.files||!input.files[0]) return;
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.products||!data.events) throw new Error('invalid format');
      confirm2(
        'データを読み込みますか？',
        `保存日時: ${data.exportedAt ? new Date(data.exportedAt).toLocaleString('ja-JP') : '不明'}\n現在のデータは上書きされます。\nDữ liệu hiện tại sẽ bị ghi đè.`,
        ()=>{
          saveProds(data.products);
          saveEvts(data.events);
          toast(t('toastRestored'));
          renderAdmin();
          renderStock();
        }
      );
    } catch(err){
      toast(t('fileError'));
    }
  };
  reader.readAsText(file);
  // Reset input so same file can be re-selected
  input.value='';
}

// ─── CONFIRM ─────────────────────────────────────────────────────────
let confCB=null;
function confirm2(title,body,ok,danger=false){
  document.getElementById('conf-title').textContent=title;
  document.getElementById('conf-body').textContent=body;
  const btn=document.getElementById('conf-ok');
  btn.className='btn '+(danger?'btn-danger':'btn-primary');
  btn.textContent=t('confirmOk');
  confCB=ok;
  document.getElementById('conf').classList.add('open');
}
function closeConf(){document.getElementById('conf').classList.remove('open');confCB=null;}
document.getElementById('conf-ok').onclick=()=>{closeConf();if(confCB)confCB();};

// ─── TOAST ───────────────────────────────────────────────────────────
let tTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(tTimer);tTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

// ─── BOOT ─────────────────────────────────────────────────────────────
boot();
applyLang();
renderStock();
</script>
